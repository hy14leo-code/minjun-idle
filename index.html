<title>이민준 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="이민준 키우기 - 공부하고 싸우며 성장하는 픽셀 아트 방치형 육성 RPG">
<meta name="theme-color" content="#0B0D1E">
<meta property="og:title" content="이민준 키우기">
<meta property="og:description" content="공부하고 싸우며 성장하는 픽셀 아트 방치형 육성 RPG">
<meta property="og:image" content="favicon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: 픽셀 아트 방치형 RPG. 맨 위에 HUD, 전장, 스킬 슬롯이 고정되고 그 아래 탭 내용이 스크롤된다. 맨 아래에 떠 있는 5탭 독. 하나의 어두운 세계관으로 고정. */
:root{
  color-scheme:dark;
  --ring:#04050C; --bg0:#0B0D1E; --panel:#1C2350; --panel2:#2A3478; --edge:#4A58C8;
  --ink:#F4F6FF; --ink2:#AEB8F0; --ink3:#7683CC;
  --gold:#FFC94A; --gold2:#FF9B1F; --cyan:#5BE8FF; --red:#FF5470; --green:#52E3A4;
  --t-common:#9AA6D6; --t-rare:#4DA3FF; --t-epic:#B07CFF; --t-legend:#FFB62E; --t-trash:#A57F4B; --t-ultra:#FF5C7A;
  --k-C:#9AA6D6; --k-B:#4DA3FF; --k-A:#B07CFF; --k-S:#FFB62E; --k-N:#FF4DD2; --k-U:#FF5C7A; --k-O:#FF9A3D; --k-D:#7A7A88; --k-X:#FF2D55; --k-H:#FFD84D; --k-M:#7CFFE8;
  --f-d:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-b:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-p:"Press Start 2P","Do Hyeon","Noto Sans KR",monospace;
  --u:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#0B0D1E}
body{
  margin:0;font-family:var(--f-b);font-size:15px;line-height:1.5;color:var(--ink);
  background-color:var(--bg0);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:8px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));min-height:100%;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg0);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
button:disabled{cursor:not-allowed}
textarea{font:inherit}
.wrap{max-width:560px;margin:0 auto}
.px{font-family:var(--f-p);font-size:10px;letter-spacing:-.5px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-d);font-weight:400}
main{display:flex;flex-direction:column;gap:20px;padding:14px 0 8px}

/* 픽셀 이미지 */
.pxi{display:block;width:calc(var(--n)*var(--u,4px));height:auto;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto}
.pxe{display:block;line-height:1;text-align:center}
.pl{width:calc(var(--n)*var(--pu,3px))}

/* 위쪽 고정 영역 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg0);padding:6px 4px 10px;border-bottom:4px solid var(--ring);margin:0 -4px}
.hud{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.portrait{position:relative;width:48px;height:48px;flex:none;background:#34408F;box-shadow:inset 0 0 0 3px var(--gold),-3px 0 0 0 var(--ring),3px 0 0 0 var(--ring),0 -3px 0 0 var(--ring),0 3px 0 0 var(--ring)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 4%;image-rendering:pixelated;display:block}
.player .pa{height:calc(var(--ah)*.95px*var(--u)/4);width:auto;max-width:none;margin:0 auto}
.skin .pa{height:calc(var(--ah)*.8px);width:auto;max-width:none}
.lvb{position:absolute;left:-4px;bottom:-8px;font-family:var(--f-p);font-size:8px;background:#000;color:var(--gold);padding:2px 4px;box-shadow:0 0 0 2px var(--gold)}
.hud-mid{min-width:0;flex:1}
.hud-name{font-family:var(--f-d);font-size:19px;line-height:1.1;white-space:nowrap;text-shadow:2px 2px 0 #000}
.rib{display:inline-block;max-width:100%;font-family:var(--f-d);font-size:12px;padding:0 7px;background:var(--gold);color:#3a2300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;box-shadow:-2px 0 0 0 var(--ring),2px 0 0 0 var(--ring),0 -2px 0 0 var(--ring),0 2px 0 0 var(--ring)}
.caps{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.cap{display:flex;align-items:center;gap:6px;background:#070918;padding:1px 8px 1px 3px;min-width:108px;box-shadow:-3px 0 0 0 var(--ring),3px 0 0 0 var(--ring),0 -3px 0 0 var(--ring),0 3px 0 0 var(--ring),inset 0 0 0 2px #2B3580}
.cap .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.cap .ic .pxi{--u:1.3px}
.cap .px{flex:1;text-align:right}

/* 패널 */
.panel{background:var(--panel);padding:14px;min-width:0;box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -4px 0 rgba(0,0,0,.3),-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.panel.gold{box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -4px 0 rgba(0,0,0,.3),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold)}
.h2{font-family:var(--f-d);font-size:19px;margin:0 0 8px;font-weight:400;display:flex;align-items:center;gap:8px;text-shadow:2px 2px 0 #000}
.h2::before{content:"";width:8px;height:18px;background:var(--gold);box-shadow:inset -3px 0 0 var(--gold2)}
.sub{color:var(--ink2);font-size:13px;margin:0}

/* 버튼 */
.btn{border:0;border-radius:0;padding:10px 14px;font-family:var(--f-d);font-size:15px;color:#fff;background:#3F5BE0;text-shadow:1px 1px 0 rgba(0,0,0,.5);box-shadow:inset 0 4px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.35),-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.btn:active:not(:disabled){transform:translateY(3px);filter:brightness(1.1)}
.btn:disabled{filter:grayscale(.9) brightness(.65)}
.btn.gold{color:#3a2300;background:var(--gold);text-shadow:none}
.btn.hot{background:#E03A5E}
.btn.ghost{background:#2A3376;color:var(--ink)}
.btn.ghost.on{background:#5A4A12;color:var(--gold);box-shadow:inset 0 4px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.35),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold)}
.btn.small{padding:6px 11px;font-size:14px}
.btn.wide{width:100%}
.btn small{font-family:var(--f-b);font-size:11.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.subtabs{display:flex;gap:14px;padding:0 4px;flex-wrap:wrap}
.chip{display:inline-block;padding:0 7px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);color:var(--ink)}
.chip i{font-style:normal;color:var(--c)}
.chip.neg{color:var(--red)}
.bar{height:14px;background:#070918;box-shadow:inset 0 0 0 2px #000;padding:2px}
.bar>i{display:block;height:100%;background:var(--c1,#7C8DFF);width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}

.pcard{border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px var(--tc),0 6px 0 rgba(0,0,0,.28)}
.pcard.t-ultra::after,.pcard.k-M::after{border-radius:16px}
.banner{font-family:var(--f-d);font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.altar .rg{border-radius:50%;border-width:3px}
.tcard{border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.tcard.sel{background:rgba(255,203,82,.1);box-shadow:inset 0 0 0 2px var(--gold)}
.tcard .tn{font-family:var(--f-d)}
.dayc{border-radius:10px}
.dayc b{font-family:var(--f-d);font-size:13px}
.code,.inp{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.ov{background:rgba(6,9,26,.72);backdrop-filter:blur(5px)}
.toast{border-radius:14px;font-family:var(--f-d);box-shadow:0 0 0 1.5px var(--gold),0 12px 0 rgba(0,0,0,.45);background:rgba(10,12,34,.95)}
.gift{border-radius:20px;background:linear-gradient(180deg,#FFDE7A,#F5AE2E);box-shadow:0 4px 0 #C47F12,0 10px 0 rgba(0,0,0,.35)}
/* 하단 탭 */
.nav-in{border-radius:22px;background:rgba(18,24,58,.92);backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 0 rgba(0,0,0,.45);padding:6px;gap:4px}
.tab{border-radius:16px;font-family:var(--f-d);font-size:13px;padding:5px 0 4px}
.tab.on{background:linear-gradient(180deg,rgba(255,203,82,.26),rgba(255,203,82,.08));box-shadow:inset 0 0 0 1.5px var(--gold)}
.tab .pxe{filter:grayscale(.55) brightness(.85)}
.tab.on .pxe{filter:none}
.tab .dot{top:2px;right:12px}

.pk{position:absolute;animation:bob .8s steps(2) infinite;z-index:1}
.pk0{left:86px;bottom:-4px}.pk1{left:54px;bottom:-10px;animation-delay:-.4s}

/* v9 */
.kop{position:absolute;left:6%;right:6%;top:26%;z-index:6;background:rgba(0,0,0,.85);padding:8px 8px 6px;text-align:center;box-shadow:inset 0 0 0 3px var(--red);font-family:var(--f-d);font-size:15px}
.kop i{display:block;font-style:normal;font-family:var(--f-b);font-size:11px;color:var(--ink2);margin-top:4px}
.pm .pet .mk{--u:1.7px}


/* ===== v20 디자인: 어두운 나무 패널 · 금속 테두리 · 금색 버튼 (모바일 방치형 RPG 느낌) ===== */
:root{
  --bg0:#140E0A; --panel:#2A1D14; --panel2:#3A2A1C;
  --ink:#FFF8EA; --ink2:#DCCBAE; --ink3:#A8937A;
  --gold:#FFCB52; --gold2:#F0922A; --metal:#8F6B38; --metal2:#5A4128;
  --edge:rgba(255,214,140,.2); --sh:0 6px 14px rgba(0,0,0,.45);
}
html{background:#100A07}
body{background-color:#100A07;background-image:radial-gradient(800px 500px at 50% -6%,rgba(190,120,50,.22),rgba(190,120,50,0) 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,rgba(0,0,0,0) 2px 8px),linear-gradient(180deg,#1C130D 0%,#100A07 80%);background-attachment:fixed}
body::before{background:#1C130D}
.top{background:linear-gradient(180deg,#2B1D13 0%,#1E140D 100%);border-bottom:3px solid #6E5230;box-shadow:0 1px 0 #1A110B,0 10px 0 rgba(0,0,0,.5);padding:8px 6px 12px;margin:0 -6px}
.hud{padding:0 0 8px;gap:10px}
.portrait{border-radius:50%;width:54px;height:54px;background:radial-gradient(circle at 50% 30%,#6C7FD8,#2C3678);box-shadow:0 0 0 3px #1A110B,0 0 0 5px var(--gold),0 4px 0 rgba(0,0,0,.5)}
.portrait img{border-radius:50%}
.lvb{border-radius:999px;background:#1A110B;box-shadow:0 0 0 2px var(--gold);bottom:-10px;left:50%;transform:translateX(-50%);font-size:11px;padding:0 8px}
.hud-name{font-size:20px;margin-left:4px;text-shadow:0 2px 0 #000,1px 1px 0 #000,-1px 1px 0 #000}
.rib{background:linear-gradient(180deg,#FFD968,#EE9F2C);color:#4A2800;box-shadow:0 0 0 1.5px #5A3A12,0 2px 0 #5A3A12}
.evb{color:#FFD98A}
.cap{border-radius:8px;background:linear-gradient(180deg,#0E0A07,#1A120C);box-shadow:inset 0 0 0 1.5px #6E5230,inset 0 2px 0 rgba(0,0,0,.6);padding:1px 10px 1px 4px;min-width:112px}
.cap .px{font-size:14px;text-shadow:0 1px 0 #000;color:#FFF3D6}
/* 전장 */
.field{border-radius:6px;margin:6px 0 0;box-shadow:0 0 0 3px #6E5230,0 0 0 5px #20150D,0 0 0 6px #A98348,0 12px 0 rgba(0,0,0,.55)}
.field.boss{box-shadow:0 0 0 3px #9A2B3C,0 0 0 5px #20150D,0 0 0 6px #FF5C78,0 0 0 rgba(255,92,120,.5)}
.field.buffed{box-shadow:0 0 0 3px #B8861F,0 0 0 5px #20150D,0 0 0 6px var(--gold),0 0 0 rgba(255,203,82,.5)}
.fh{left:50%;right:auto;top:6px;transform:translateX(-50%);max-width:66%;width:max-content;align-items:center;text-align:center;gap:3px}
.stgrow{display:flex;align-items:center;gap:0;pointer-events:none}
.stgbtn{pointer-events:auto;width:30px;height:34px;border:0;padding:0;font-size:15px;color:#FFE9A8;background:linear-gradient(180deg,#5A4128,#34241A);box-shadow:inset 0 0 0 2px #A98348,0 3px 0 #1A110B;cursor:pointer;font-family:var(--f-d);border-radius:6px}
.stgbtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #A98348,0 1px 0 #1A110B}
.fstage{border-radius:0;min-width:132px;height:34px;padding:0 10px;background:linear-gradient(180deg,#4A3422,#2A1C12);box-shadow:inset 0 0 0 2px #A98348,inset 0 2px 0 rgba(255,255,255,.12);font-size:18px;text-shadow:0 2px 0 #000,1px 1px 0 #000,-1px 1px 0 #000;display:grid;place-items:center;line-height:1}
.fphase{border-radius:6px;background:rgba(14,9,6,.62);font-size:12px;padding:0 10px}
.pips{display:flex;gap:0;width:min(190px,48vw);height:12px;margin:2px 0 0;border-radius:4px;background:#1A110B;box-shadow:inset 0 0 0 2px #6E5230;overflow:hidden;position:relative;justify-content:stretch}
.pips span{flex:1;height:100%;width:auto;border-radius:0;background:transparent;box-shadow:inset -1px 0 0 rgba(0,0,0,.35)}
.pips span.on{background:linear-gradient(180deg,#FFD968,#EE9F2C);box-shadow:inset -1px 0 0 rgba(0,0,0,.25)}
.tm{border-radius:4px;background:#1A110B;box-shadow:inset 0 0 0 2px #6E5230;width:min(190px,48vw);height:16px}
.tm i{border-radius:2px;background:linear-gradient(180deg,#FF8E86,#D8343C)}
.ficons{flex-direction:column;top:8px;left:8px;right:auto;gap:7px}
.fib{border-radius:50%;width:36px;height:36px;background:radial-gradient(circle at 50% 30%,#5A4128,#241810);box-shadow:inset 0 0 0 2px #A98348,0 2px 0 rgba(0,0,0,.5);backdrop-filter:none}
.fboss{top:64px}
.ehp{border-radius:3px;background:#1A110B;box-shadow:inset 0 0 0 2px #6E5230;padding:2px}
.ehp>i{border-radius:1px;background:linear-gradient(180deg,#FF8E86,#D8343C)}
.phb{border-radius:3px;background:#1A110B;box-shadow:inset 0 0 0 2px #6E5230}
.phb i{border-radius:1px}
.ename{font-size:13px;text-shadow:0 2px 0 #000,1px 1px 0 #000,-1px 1px 0 #000}
.dmg{font-size:18px;font-weight:400;-webkit-text-stroke:2px #1A0F0A;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.dmg.crit{font-size:26px;color:#FFD24A}.dmg.big{font-size:28px;color:#FF9DB3}.dmg.fr{font-size:13px}.dmg.gold{font-size:16px;color:#FFE27A}
.dmg.hurt{font-size:16px;color:#FF6B6B}
/* 스킬 줄: 둥근 금속 슬롯 */
.sbar{padding:12px 4px 2px;gap:8px;align-items:center}
.skb{border-radius:50%;max-width:54px;background:radial-gradient(circle at 50% 28%,#4A3522,#1E140D);box-shadow:inset 0 0 0 3px var(--tc,#8F6B38),0 0 0 2px #140D08,0 4px 0 rgba(0,0,0,.5)}
.skb.emp{background:radial-gradient(circle at 50% 28%,#2B1F16,#160F0A);box-shadow:inset 0 0 0 3px #4A3522,0 0 0 2px #140D08}
.skb.emp .e{font-size:26px;color:#8F6B38}
.skb.act{background:radial-gradient(circle at 50% 28%,#B07A12,#5A3A06)}
.skb .cdm{border-radius:0;background:rgba(10,6,3,.72)}
.skn{font-size:11.5px;text-shadow:0 1px 0 #000}
.mini{border-radius:6px;background:linear-gradient(180deg,#5A4128,#34241A);box-shadow:inset 0 0 0 2px #8F6B38,0 2px 0 #140D08;color:#FFE9A8;font-size:12px}
.mini.on{background:linear-gradient(180deg,#FFD968,#EE9F2C);color:#4A2800;box-shadow:inset 0 0 0 2px #FFF0B0,0 2px 0 #5A3A12}
/* 패널/버튼 */
.panel{border-radius:10px;border:2px solid #6E5230;background:linear-gradient(180deg,#34251A 0%,#251A12 100%);box-shadow:inset 0 0 0 1px rgba(255,214,140,.14),inset 0 2px 0 rgba(255,255,255,.07),var(--sh)}
.panel.gold{border-color:#B8861F;box-shadow:inset 0 0 0 1px rgba(255,214,140,.3),0 0 0 rgba(255,203,82,.14),var(--sh)}
.h2{font-size:20px;text-shadow:0 2px 0 #000}
.h2::before{border-radius:2px;background:linear-gradient(180deg,#FFD968,#EE9F2C)}
.btn{border-radius:8px;font-size:16px;color:#fff;background:linear-gradient(180deg,#FFC24A 0%,#F08A1E 100%);box-shadow:inset 0 0 0 2px #FFE49A,0 0 0 2px #5A3A12,0 4px 0 2px #3C2408;text-shadow:0 2px 0 #7A3F00,1px 1px 0 #7A3F00,-1px 1px 0 #7A3F00}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 0 0 2px #FFE49A,0 0 0 2px #5A3A12,0 1px 0 2px #3C2408;filter:none}
.btn.gold{background:linear-gradient(180deg,#FFD968 0%,#F5A12A 100%);color:#fff}
.btn.hot{background:linear-gradient(180deg,#FF8A84,#D8343C);box-shadow:inset 0 0 0 2px #FFC0BC,0 0 0 2px #5A1020,0 4px 0 2px #3C0A14;text-shadow:0 2px 0 #7A1020,1px 1px 0 #7A1020,-1px 1px 0 #7A1020}
.btn.ghost{background:linear-gradient(180deg,#4A3422,#2E2016);color:#F3E3C4;text-shadow:0 2px 0 #000;box-shadow:inset 0 0 0 2px #8F6B38,0 0 0 2px #140D08,0 4px 0 2px #0C0705}
.btn.ghost.on{background:linear-gradient(180deg,#FFD968,#EE9F2C);color:#4A2800;text-shadow:none;box-shadow:inset 0 0 0 2px #FFF0B0,0 0 0 2px #5A3A12,0 4px 0 2px #3C2408}
.btn:disabled{filter:grayscale(.7) brightness(.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 0 0 2px #2A1D14,0 3px 0 2px #120C08}
.btn.small{padding:7px 12px;font-size:15px}
.subtabs{gap:0;border-bottom:3px solid #6E5230;padding:0}
.subtabs .btn.small{border-radius:8px 8px 0 0;padding:9px 18px;margin-bottom:-3px;background:linear-gradient(180deg,#3A2A1C,#241912);color:#BFA880;text-shadow:0 2px 0 #000;box-shadow:inset 0 0 0 2px #5A4128;font-size:15px}
.subtabs .btn.small:active:not(:disabled){transform:none}
.subtabs .btn.small.on{background:linear-gradient(180deg,#FFD968,#EE9F2C);color:#4A2800;text-shadow:none;box-shadow:inset 0 0 0 2px #FFF0B0,0 0 0 2px #5A3A12}
.chip{border-radius:5px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,214,140,.2)}
.tier{border-radius:4px}
.bar{border-radius:4px;background:#140D08;box-shadow:inset 0 0 0 2px #5A4128}
.bar>i{border-radius:2px}
.st{border-radius:6px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,214,140,.16)}
.cpn{color:var(--gold)}
th,td{border-bottom:1px solid rgba(255,214,140,.1)}
th{color:#B9A483}
/* 능력 강화: 한 줄 카드 + 초록 증가표시 + 금색 가격 버튼 */
.up{grid-template-columns:54px 1fr auto;gap:12px;padding:10px;margin-bottom:8px;background:linear-gradient(180deg,#2E2118,#21170F);border:2px solid #5A4128;border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.05),inset 0 -3px 0 rgba(0,0,0,.3)}
.up:last-child{border-bottom:2px solid #5A4128}
.upi{border-radius:6px;width:54px;height:54px;background:linear-gradient(180deg,var(--u1),#14100C);box-shadow:inset 0 0 0 2px #A98348,inset 0 0 0 4px #14100C;position:relative}
.up .nm{font-size:17px;text-shadow:0 2px 0 #000}
.up .ef{display:inline-block;margin-top:4px;padding:3px 10px;background:#140D08;border-radius:5px;box-shadow:inset 0 0 0 1px #4A3522;color:#EADBC0;font-size:13px}
.up .ef .gn{color:#6CFF7E}
.up .ub{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.up .mxl{font-size:11px;color:#B9A483}
.up .btn{min-width:116px;padding:8px 10px}
.up .btn .cost{display:block;font-size:17px;line-height:1.1}
.up .btn small{display:block;font-size:11px;opacity:.95;text-shadow:0 1px 0 #7A3F00}
.irow{border-bottom:1px solid rgba(255,214,140,.1)}
.ie2{border-radius:6px;background:linear-gradient(180deg,#2E2118,#17100B);box-shadow:inset 0 0 0 2px var(--tc,#6E5230)}
.sbox,.slotc,.skin,.tcard,.pcard{border-radius:8px;background:linear-gradient(180deg,#2E2118,#1C130D);box-shadow:inset 0 0 0 2px #5A4128}
.sbox.on{box-shadow:inset 0 0 0 2px var(--tc,#A98348)}
.slotc{box-shadow:inset 0 0 0 2px var(--tc,#5A4128)}
.skin.sel,.tcard.sel{background:linear-gradient(180deg,#4A3510,#2C1F0A);box-shadow:inset 0 0 0 2px var(--gold)}
.pcard{box-shadow:inset 0 0 0 2px var(--tc),0 6px 0 rgba(0,0,0,.4)}
.code,.inp{border-radius:6px;background:#140D08;box-shadow:inset 0 0 0 2px #5A4128}
.ov{background:rgba(10,6,3,.78)}
.toast{border-radius:8px;background:rgba(20,13,8,.96);box-shadow:0 0 0 2px var(--gold),0 8px 0 rgba(0,0,0,.5)}
.dayc{border-radius:6px;background:#1E140D;box-shadow:inset 0 0 0 2px #5A4128}
.kop{border-radius:8px;background:rgba(20,10,8,.9)}
/* 하단 메뉴: 화면 아래에 붙은 나무판 + 큰 아이콘 */
.nav{left:0;right:0;bottom:0;padding:0}
.nav-in{max-width:none;width:100%;border-radius:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;background:linear-gradient(180deg,#3C2A1B 0%,#1E140D 100%);box-shadow:0 -3px 0 #6E5230,0 -5px 0 #20150D,0 -6px 0 rgba(0,0,0,.5);backdrop-filter:none}
.tab{border-radius:8px;font-size:13px;padding:4px 0 3px;color:#C9B492;text-shadow:0 2px 0 #000,1px 1px 0 #000,-1px 1px 0 #000;gap:0;background:linear-gradient(180deg,#34251A,#22170F);box-shadow:inset 0 0 0 2px #5A4128}
.tab .pxe{font-size:27px!important;line-height:1.15;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.tab.on{color:#FFF3C8;background:linear-gradient(180deg,#7A5A24,#3E2A10);box-shadow:inset 0 0 0 2px var(--gold),0 0 0 rgba(255,203,82,.3)}
.tab:not(.on) .pxe{filter:grayscale(.35) brightness(.82) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.tab .dot{top:0;right:16%}
body{padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.gift{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:50%}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.nav-in{padding-left:calc(50% - 380px);padding-right:calc(50% - 380px)}.fstage{font-size:20px;min-width:160px;height:38px}.stgbtn{height:38px;width:34px}.fib{width:40px;height:40px}}


/* v20 보정: 중앙 스테이지 판 */
.fh{left:50%!important;right:auto!important;transform:translateX(-50%);max-width:70%;width:max-content;align-items:center!important;text-align:center}
.pips{justify-content:stretch}
.fphase{align-self:center}
.hud{flex-wrap:nowrap}
.lvb{white-space:nowrap}
.portrait{overflow:visible}

/* ===== v21 픽셀 복원 ===== */
:root{--f-d:"Galmuri","Jua","Noto Sans KR",sans-serif;--f-p:"Galmuri","Noto Sans KR",sans-serif}
html,body,button,input,textarea,select{font-family:"Galmuri","Noto Sans KR",sans-serif!important;-webkit-font-smoothing:none;font-smooth:never}
*,*::before,*::after{border-radius:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.pshadow,.eshadow{border-radius:50%!important}
img,canvas,.scn,.portrait img,.pxi{image-rendering:pixelated;image-rendering:crisp-edges}
.scn{image-rendering:pixelated!important;image-rendering:crisp-edges!important}
.pxe{filter:none}
/* 계단식 모서리 패널 */
.panel,.st,.ie2,.sbox,.slotc,.skin,.pcard,.tcard,.toast,.kop,.cap,.field,.nav-in,.fstage{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.btn,.mini,.up,.stgbtn{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.skb{border-radius:0!important}
.skb,.portrait,.fib{box-shadow:inset 0 0 0 3px #8F6B38,inset 0 0 0 5px #20150D}
.bar>i,.tm i,.ehp>i,.phb i{background:#D8343C;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.3)}
.bar,.tm,.ehp,.phb,.pips{box-shadow:inset 0 0 0 2px #6E5230,inset 0 0 0 4px #1A110B}
body,.panel,.btn{text-shadow:none}
.h2,.fstage,.tier,.lvb,.rib{letter-spacing:0}

.tier.k-H{background:linear-gradient(90deg,#FFD84D,#FF6FD8,#7CE8FF);color:#1A1030;animation:rb 1.2s steps(6) infinite}
.pcard.k-H::after{content:"";position:absolute;inset:-4px;border:4px solid #FFD84D;animation:rb 1.2s steps(6) infinite;pointer-events:none}

.tier.k-X{background:linear-gradient(90deg,#2A0010,#FF2D55,#2A0010);color:#fff;animation:rb 1.2s steps(6) infinite}
.pcard.k-X::after{content:"";position:absolute;inset:-4px;border:4px solid #FF2D55;animation:rb 1.2s steps(6) infinite;pointer-events:none}

.irow.gx .ie2,.irow.gx .t,.irow.gx .d{cursor:pointer}
.irow.gx.open{background:rgba(255,203,82,.07)}

.k-E{--tc:#6FE0FF}
.tier.k-E{background:linear-gradient(90deg,#FF7A2A,#2F7FE0,#3FCB8A,#E8C82A,#7A4AC0);color:#fff;animation:rb 1.2s steps(6) infinite}

.tier.k-O{background:linear-gradient(90deg,#FFB02E,#FF6A3D,#FF4DD2);color:#1A1030;animation:rb 1.2s steps(6) infinite}
.pcard.k-O::after{content:"";position:absolute;inset:-4px;border:4px solid #FF9A3D;animation:rb 1.2s steps(6) infinite;pointer-events:none}
.tier.k-D{background:#4A4A56;color:#C8C8D0}

@keyframes archglow{0%{filter:drop-shadow(0 0 3px #E8482A) drop-shadow(0 0 8px #E8482A)}12.5%{filter:drop-shadow(0 0 3px #E8C82A) drop-shadow(0 0 8px #E8C82A)}25%{filter:drop-shadow(0 0 3px #3FCB8A) drop-shadow(0 0 8px #3FCB8A)}37.5%{filter:drop-shadow(0 0 3px #7FD0F0) drop-shadow(0 0 8px #7FD0F0)}50%{filter:drop-shadow(0 0 3px #2F7FE0) drop-shadow(0 0 8px #2F7FE0)}62.5%{filter:drop-shadow(0 0 3px #7A4AC0) drop-shadow(0 0 8px #7A4AC0)}75%{filter:drop-shadow(0 0 3px #FFE88A) drop-shadow(0 0 8px #FFE88A)}87.5%{filter:drop-shadow(0 0 3px #A8793A) drop-shadow(0 0 8px #A8793A)}100%{filter:drop-shadow(0 0 3px #E8482A) drop-shadow(0 0 8px #E8482A)}}
.pxi.arch{animation:archglow 4s steps(16) infinite}

/* ---------- 전투: 몬스터 반격 ---------- */
var REFG=1.2,MK_N=0.04,MK_B=0.07,MK_M=0.1;
function mDmgAt(st,boss,major){return 100*Math.pow(REFG,st-1)*(boss?(major?MK_M:MK_B):MK_N)*Math.min(1,(st+3)/20)}
function gearProcs(){
  var o={burst:[],dodge:0,reflect:0,revive:0,killheal:0,gb:null,heal:null};
  SLOTS.forEach(function(sl){
    var id=S.equip[sl];if(!id||!S.inv[id])return;
    var it=ITEM[id];if(!it||!it.pr)return;
    var lv=S.inv[id].lv||0,k=1+0.15*lv,p=it.pr;
    if(p.k==="burst")o.burst.push({c:p.c*k,m:p.m,n:p.n,e:p.e});
    else if(p.k==="dodge")o.dodge+=p.v*k;
    else if(p.k==="reflect")o.reflect+=p.v*k;
    else if(p.k==="revive")o.revive=Math.max(o.revive,Math.min(80,p.v+3*lv));
    else if(p.k==="killheal")o.killheal+=p.v*k;
    else if(p.k==="gb")o.gb={c:p.c*k,m:p.m,n:p.n};
    else if(p.k==="heal")o.heal={c:p.c*k,v:p.v,n:p.n};
  });
  o.dodge=Math.min(40,o.dodge);o.reflect=Math.min(80,o.reflect);
  return o;
}
function healP(p){T.hp=Math.min(T.hpMax,T.hp+T.hpMax*p/100)}
function hurtFx(d,big){
  popAt("-"+fmt(d),big?"hurt big":"hurt",0.24,0.5);
  if(E.enemy){E.enemy.classList.remove("atk");void E.enemy.offsetWidth;E.enemy.classList.add("atk")}
  if(E.player){E.player.classList.remove("hurt");void E.player.offsetWidth;E.player.classList.add("hurt")}
  snd(160,0.08,"sawtooth",0.025,90);
}
function enemyAttack(dt,c){
  if(SFc.charm||T.revolt>0||T.stun>0)return;
  var boss=F.boss,iv=boss?1.2:1.8,n=0;
  F.at+=dt;
  while(F&&F.at>=iv&&n<4){
    F.at-=iv;n++;F.hn++;
    var big=boss&&F.hn%4===0,pr=gearProcs();
    if(pr.dodge>0&&Math.random()*100<pr.dodge){popAt("회피!","gold",0.26,0.55);continue}
    var raw=mDmgAt(S.stage,boss,F.major)*(big?2:1);
    var d=Math.max(1,raw*(1-c.dr)*SFc.dr*(1-CMc.sponge)*(T.drT>0?1-T.drV:1));
    T.hp-=d;
    hurtFx(d,big);
    if(pr.reflect>0&&F){var rd=raw*pr.reflect/100;popAt("반사 "+fmt(rd),"big",0.7,0.5);deal(rd)}
    if(pr.heal&&Math.random()*100<pr.heal.c){healP(pr.heal.v);popAt(pr.heal.n+" +"+pr.heal.v+"%","gold",0.26,0.7)}
    if(T.hp<=0){playerDown();return}
  }
}
function playerDown(){
  var c=calc(),pr=gearProcs();
  if(pr.revive>0&&T.revT<=0){
    T.hp=c.hp*pr.revive/100;T.revT=90;
    bannerFx("부활!");toast("용사의 의지! 체력 "+Math.round(pr.revive)+"%로 부활했어요");jingle([523,784,1046]);
    return;
  }
  S.dth=(S.dth||0)+1;T.hp=c.hp*0.5;
  bannerFx("KO",true);snd(300,0.4,"sawtooth",0.04,80);
  if(F&&F.boss&&!F.dungeon){
    toast(F.name+"에게 쓰러졌어요! 같은 보스에 재도전할 수 있어요");
    T.ko={t:12};kills=0;F=null;
    return;
  }
  T.koN++;kills=0;F=null;T.spawnT=3;
  if(T.koN>=3&&S.stage>1&&(S.stage-1)%10!==0&&!S.lock){S.stage--;T.koN=0;toast("연달아 쓰러져서 한 스테이지 물러났어요. 맷집·방어를 올려 보세요")}
  else toast("쓰러졌어요. 잠시 쉬고 같은 스테이지에서 다시 싸워요");
}
function deal(d){
  if(!F||F.inv>0)return;
  d*=SFc.dmgM*(F.armor||1);
  if(F.dungeon){DG.dmg+=d;return}
  F.hp-=d;

}

/* ---------- 뽑기 ---------- */
/* 성장 단계에 맞춰 높은 등급 비중을 조절한다 */
function earlyF(){var b=S.best;return b<10?0.15:b<20?0.4:b<40?0.7:b<60?0.9:1}
function adjPool(pool){
  var f=earlyF(),extra=0,out=pool.map(function(t){
    var p=t.p;
    if(t.rank>=3){var a=p*f;extra+=p-a;p=a}
    else if(t.rank===2){var r=p*(0.5+0.5*f);extra+=p-r;p=r}
    return {t:t,p:p};
  });
  var tg=null;
  out.forEach(function(o){if(o.t.sink)tg=o});
  if(!tg)out.forEach(function(o){if(!tg||o.t.rank<tg.t.rank)tg=o});
  tg.p+=extra;
  return out;
}
function rollTier(pool){
  var adj=adjPool(pool),tot=0;
  adj.forEach(function(o){tot+=o.p});
  var r=Math.random()*tot;
  for(var i=0;i<adj.length;i++){r-=adj[i].p;if(r<0)return adj[i].t}
  return adj[adj.length-1].t;
}
function pullOne(pool){
  S.pity++;
  var t=(S.pity>=100&&S.best>=30)?TI.ultra:rollTier(pool||TIERS);
  if(t.id==="ultra")S.pity=0;
  var list=ITEMS.filter(function(i){return i.t===t.id});
  var it=pickRand(list),own=S.inv[it.id],isNew=false,sh=0;
  if(!own){S.inv[it.id]={n:1,lv:0};isNew=true}
  else{own.n++;sh=t.sh;S.shards+=sh}
  S.pulls++;
  return {id:it.id,t:it.t,isNew:isNew,up:false,sh:sh};
}
function pullSk(pool){
  S.pit.sk++;S.pit.skn++;S.pit.skx=(S.pit.skx||0)+1;
  var t=(S.pit.skx>=600&&S.best>=60)?SKTI.X:(S.pit.skn>=300&&S.best>=30)?SKTI.N:(S.pit.sk>=60&&S.best>=30)?SKTI.S:rollTier(pool||SKTIERS);
  if(t.id==="S"||t.id==="N"||t.id==="X")S.pit.sk=0;
  if(t.id==="N"||t.id==="X")S.pit.skn=0;
  if(t.id==="X")S.pit.skx=0;
  var sk=pickRand(SKL.filter(function(s){return s.t===t.id})),own=S.skl[sk.id],isNew=false,up=false,sh=0;
  if(!own){
    S.skl[sk.id]={n:1,lv:1};isNew=true;
    var ei=S.slots.indexOf(null);if(ei>=0&&!(isTop(sk)&&S.slots.some(function(x){return x&&SKM[x]&&isTop(SKM[x])})))S.slots[ei]=sk.id;
  }else{
    own.n++;
    if(own.lv<SKMAX){own.lv++;up=true}else{sh=t.sh;S.shards+=sh}
  }
  return {id:sk.id,t:t.id,isNew:isNew,up:up,sh:sh};
}
function pullCm(pool){
  S.pit.cm++;S.pit.cmu++;S.pit.cmm++;
  var t=(S.pit.cmm>=400&&S.best>=30)?CMTI.M:(S.pit.cmu>=150&&S.best>=30)?CMTI.U:(S.pit.cm>=40&&S.best>=30)?CMTI.S:rollTier(pool||CMTIERS);
  if(t.id==="S"||t.id==="O"||t.id==="U"||t.id==="M")S.pit.cm=0;
  var cl=CM.filter(function(s){return s.t===t.id});
  if(!cl.length){t=CMTI.U;cl=CM.filter(function(s){return s.t==="U"})}
  if(t.id==="S"||t.id==="O"||t.id==="U"||t.id==="H"||t.id==="M")S.pit.cm=0;
  if(t.id==="U"||t.id==="H"||t.id==="M")S.pit.cmu=0;
  if(t.id==="M")S.pit.cmm=0;
  if(t.id==="C"&&CMM.dohyeon.t==="C")cl=cl.concat([CMM.dohyeon,CMM.dohyeon]);
  var cm=pickRand(cl),own=S.cmp[cm.id],isNew=false,up=false,sh=0;
  if(!own){
    S.cmp[cm.id]={n:1,lv:1};isNew=true;
    var ei=S.party.indexOf(null);if(ei>=0&&cm.id!=="juyul"){S.party[ei]=cm.id;refreshCM();paintParty()}
  }else{
    own.n++;
    if(own.lv<CMAX){own.lv++;up=true;refreshCM()}else{sh=t.sh;S.shards+=sh}
  }

  f.char=mqCan()||UP.some(function(u,i){return !(u.max&&S.up[i]>=u.max)&&S.gold>=upCostN(i,1)});
  f.skill=S.slots.indexOf(null)>=0&&Object.keys(S.skl).some(function(id){return S.slots.indexOf(id)<0});

  f.party=S.party.indexOf(null)>=0&&Object.keys(S.cmp).some(function(id){return S.party.indexOf(id)<0});
  f.party=f.party||(S.pets.indexOf(null)>=0&&Object.keys(S.pet).some(function(id){return S.pets.indexOf(id)<0}));
  f.gacha=S.tickets>0;

  for(var i=0;i<ds.length;i++)ds[i].hidden=!f[ds[i].getAttribute("data-d")];
  var sd=document.querySelectorAll(".sdot");

}

}

  S.pit.pt++;S.pit.ptu=(S.pit.ptu||0)+1;
  var t=(S.pit.ptu>=150&&S.best>=30)?PTTI.U:(S.pit.pt>=40&&S.best>=30)?PTTI.S:rollTier(pool||PTTIERS);
  if(t.id==="S"||t.id==="O"||t.id==="U"||t.id==="M")S.pit.pt=0;
  if(t.id==="U"||t.id==="M")S.pit.ptu=0;
  var pt=pickRand(PETS.filter(function(p){return p.t===t.id})),own=S.pet[pt.id],isNew=false,up=false,sh=0;

    S.pet[pt.id]={n:1,lv:1};isNew=true;

  }else{

function attInfo(){
  var now=new Date(),k=dayKey(now),yk=dayKey(new Date(now.getTime()-86400000));

  return {claimed:claimed,next:next,k:k};

function step(dt){
  SKL.forEach(function(sk){
    if(cds[sk.id]>0)cds[sk.id]=Math.max(0,cds[sk.id]-dt);
    if(eff[sk.id]>0)eff[sk.id]=Math.max(0,eff[sk.id]-dt);
  });
  refreshSF();refreshEV();
  if(S.stage>S.rbest){S.rbest=S.stage;S.stuckT=0}
  if(!paused())S.stuckT=(S.stuckT||0)+dt;
  if(S.sm<Math.floor(S.best/10))milestone();
  if(S.ab&&rsLv("auto")>0){T.abT=(T.abT||0)+dt;if(T.abT>=1){T.abT=0;autoBuy()}}
  var c=calc();
  if(T.hp<0)T.hp=c.hp;
  if(T.hpMax>0&&c.hp>T.hpMax)T.hp+=c.hp-T.hpMax;
  T.hpMax=c.hp;
  T.hp=Math.min(c.hp,T.hp+c.hp*c.rg*dt);
  if(T.revT>0)T.revT-=dt;
  if(T.revolt>0)T.revolt-=dt;
  T.eggT=(T.eggT||0)+dt;if(T.eggT>2){T.eggT=0;eggCheck()}
  if(T.hitFx>0)T.hitFx-=dt;
  if(T.sndT>0)T.sndT-=dt;
  if(T.combo>0){T.comboT-=dt;if(T.comboT<=0)T.combo=0}
  if(!F){if(T.ko){T.ko.t-=dt;if(T.ko.t<=0)koDecide("back")}else{T.spawnT-=dt;if(T.spawnT<=0)spawn()}}
  else{
    T.acc+=dt*c.spd;var n=0;
    while(T.acc>=1&&n<12&&F){T.acc-=1;n++;hit(c)}
    if(F){
      var ps=c.fr+c.pd+c.atk*SFc.dot;
      if(ps>0){
        var d=ps*dt;T.fAcc+=d;T.fT+=dt;deal(d);
        if(T.fT>=0.7){
          popAt(fmt(T.fAcc),"fr",0.12,0.22);
          T.fAcc=0;T.fT=0;
        }
      }
    }
    if(F&&F.boss){
      if(F.dungeon){F.t-=dt;T.dgA=(T.dgA||0)-dt;if(T.dgA<=0){T.dgA=1.5;dgAtkFx()}if(F.t<=0)dgEnd()}
      else{
        if(F.inv>0)F.inv-=dt;
        if(F.regen)F.hp=Math.min(F.max,F.hp+F.max*F.regen*dt);
        if(CMc.heal>0){T.healT+=dt;if(T.healT>=12){T.healT=0;F.t=Math.min(F.tmax,F.t+CMc.heal);popAt("+"+f1(CMc.heal)+"초","gold",0.3,0.6)}}
        if(!SFc.freeze)F.t-=dt;
        if(F.t<=0)bossTimeout();
      }
    }else if(F&&F.gold){F.t-=dt;if(F.t<=0){toast("황금 몬스터가 도망갔어요!");F=null;T.spawnT=0.3}}
  }
  if(F&&!F.dungeon&&!F.gold)enemyAttack(dt,c);
  autoSkills();
  cabTick(dt,c);
  if(!G){
    T.giftT-=dt;
    if(T.giftT<=0){G={t:20};$("gift").hidden=false}
  }else{
    G.t-=dt;
    if(G.t<=0){G=null;T.giftT=giftDelay();$("gift").hidden=true}
  }
  T.gpsT+=dt;
  if(T.gpsT>=2){S.gps=S.gps*0.8+(T.gpsG/T.gpsT)*0.2;T.gpsG=0;T.gpsT=0}
  T.saveT+=dt;
  if(T.saveT>=4){T.saveT=0;save()}
}
function tick(){
  var now=performance.now(),raw=(now-T.last)/1000;T.last=now;
  if(toastT>0){toastT-=Math.min(0.5,raw);if(toastT<=0)$("toast").hidden=true}
  dqRoll();netTick(raw);
  if(paused())return;
  var dt=Math.min(0.5,raw)*S.speed;
  if(raw>6&&S.gps>0){
    var g=offGold(raw),otk=offTix(raw);S.gold+=g;S.tickets+=otk;
    toast("자리를 비운 동안 골드 "+fmt(g)+(otk?" · 뽑기권 "+otk+"장":"")+" 획득");
  }
  step(dt);
  uiTop();
  uiBattle();
  if(tab==="char"&&sub.char==="up")uiGrow();
  else if(tab==="char"&&sub.char==="info")uiInfo();
  else if(tab==="gacha")uiGacha();
}

function skDesc0(sk,p,lv){
  if(sk.mimic)return "장착한 다른 스킬을 전부 따라 해요: 즉발 피해는 80%만큼 한 번 더, 버프는 쿨타임 없이 전부 발동 (국가권력급 이상 제외)";
  if(sk.nuke&&!sk.buff)return "즉시 공격력 ×"+r0(sk.nuke*p)+" 피해";
  if(sk.cdr&&!sk.buff)return "다른 스킬의 대기시간 −"+f1(sk.cdr*p)+"초";
  var b=sk.buff,s=[],dur=sk.dur*(1+0.1*(eLv((lv||1),5,0.25)-1));
  if(b.freeze)s.push("보스 제한시간 정지");
  if(b.atkM)s.push("공격력 +"+r0((b.atkM-1)*p*100)+"%");
  if(b.spdM)s.push("공격 속도 ×"+f1(1+(b.spdM-1)*p));
  if(b.crit100)s.push("치명타 확률 100%");
  if(b.critAdd)s.push("치명타 확률 +"+r0(b.critAdd*p*100)+"%p");
  if(b.cdAdd)s.push("치명타 피해 +"+r0(b.cdAdd*p*100)+"%p");
  if(b.goldM)s.push("골드 ×"+f1(1+(b.goldM-1)*p));
  if(b.frM)s.push("친구 도움 ×"+f1(1+(b.frM-1)*p));
  if(b.dmgM)s.push("주는 피해 ×"+f1(1+(b.dmgM-1)*p));
  if(b.dot)s.push("초당 공격력 ×"+f1(b.dot*p)+" 지속 피해");
  if(b.dr)s.push("받는 피해 −"+r0(Math.min(0.8,b.dr*p)*100)+"%");
  if(b.charm)s.push("몬스터 매혹(공격 못 함)");
  return (sk.nuke?"즉시 공격력 ×"+r0(sk.nuke*p)+" 피해 + ":"")+(sk.cdr?"다른 스킬 대기시간 전부 초기화 + ":"")+f1(dur)+"초간 "+s.join(", ");
}

function pullCard(kind,r,i){
  var icon,name,tier,cls,st;
  if(kind==="eq"){var it=ITEM[r.id];icon=spr(it.e,16,2.8);name=it.n;tier='<span class="tier t-'+it.t+'">'+TI[it.t].n+'</span>';cls="t-"+it.t}
  else if(kind==="sk"){var sk=SKM[r.id];icon=spr(sk.e,18,2.4);name=sk.n;tier='<span class="tier k-'+sk.t+'">'+tl2(sk.t)+'</span>';cls="k-"+sk.t}
  else if(kind==="pt"){var pt=PETM[r.id];icon=petImg(r.id,3);name=pt.n;tier='<span class="tier k-'+pt.t+'">'+tl2(pt.t)+'</span>';cls="k-"+pt.t}
  else{var cm=CMM[r.id];icon=cimg(r.id,2.2);name=cm.n+" ("+cm.role+")";tier='<span class="tier k-'+cm.t+'">'+tl2(cm.t)+'</span>';cls="k-"+cm.t}
  st=r.isNew?"NEW":r.up?"레벨 상승!":"조각 +"+r.sh;
  if(r.deb)st+=" · 뽑기권 −1";
  return '<div class="pcard '+cls+'" style="--i:'+i+'">'+icon+'<span class="n">'+name+'</span>'+tier+'<span class="s">'+st+"</span></div>";
}

function uiBattle(){
  if(!E.field)return;
  var c=calc(),pips=$("b-pips").childNodes;
  $("b-stg").textContent="STAGE "+S.stage+(S.lock?" 🔒":" ▾");
  var wid=S.equip.weapon||"";
  if(E.pwk!==wid){E.pwk=wid;$("b-pw").innerHTML=wid?spr(ITEM[wid].e,14,1.6):""}
  if(F){
    var ratio=Math.max(0,F.hp/F.max);
    $("b-hp").style.width=ratio*100+"%";
    $("b-hpt").textContent=F.dungeon?fmt(DG.dmg):fmt(Math.max(0,F.hp));
    E.enemy.style.visibility="visible";
    if(!F.boss){
      $("b-e2").classList.toggle("gone",ratio<0.66);
      $("b-e1").classList.toggle("gone",ratio<0.33);
    }
    if(F.boss){
      $("b-pips").hidden=true;$("b-tm").hidden=false;
      $("b-tmi").style.width=Math.max(0,Math.min(100,F.t/F.tmax*100))*0.97+"%";
      $("b-tmt").textContent="남은 시간 "+Math.max(0,F.t).toFixed(1)+"초"+(SFc.freeze?" (정지)":"");
    }else{
      $("b-pips").hidden=false;$("b-tm").hidden=true;
      for(var i=0;i<pips.length;i++)pips[i].className=i<kills?"on":"";
    }
  }else{
    E.enemy.style.visibility="hidden";
  }
  var buffed=SKL.some(function(s){return eff[s.id]>0});
  E.field.classList.toggle("buffed",buffed);
  $("b-player").classList.toggle("dash",SFc.spdM>1.5);
  var hr=T.hpMax>0?Math.max(0,Math.min(1,T.hp/T.hpMax)):1;
  $("b-php").style.width=hr*100+"%";$("b-php").style.background=hr<0.3?"#FF5470":hr<0.6?"#FFC94A":"#52E3A4";
  $("b-phpt").textContent=fmt(Math.max(0,T.hp));
  auraFx();
  var ko=$("b-ko");if(ko){ko.hidden=!T.ko;if(T.ko)$("b-kot").textContent=Math.ceil(T.ko.t)+"초 뒤 자동으로 아래 스테이지에서 파밍"}
  $("b-combo").textContent=T.combo>1?"COMBO "+T.combo+" +"+Math.round(Math.min(1,T.combo*0.02)*100)+"%":"";
  $("b-boss").hidden=!(S.bossReady&&(S.stage+1)%10===0&&!(F&&F.boss));
  $("b-tAS").classList.toggle("on",S.autoSkill);
  $("b-spd").textContent="×"+S.speed;$("b-spd").classList.toggle("on",S.speed>1);
  $("b-fold").textContent=$("top").classList.contains&&E.fold?"펴기":"접기";
  for(var s=0;s<4;s++){
    var id=S.slots[s];if(!id)continue;
    var sk=SKM[id],el=$("sk-"+s);if(!el)continue;
    var cd=cds[id],on=eff[id]>0,tot=sk.cd*(1-cdCut());
    el.disabled=cd>0;
    el.classList.toggle("act",on);
    el.classList.toggle("rdy",cd<=0&&!on);
    $("cdm-"+s).style.height=cd>0?Math.min(100,cd/tot*100)+"%":"0";
    $("cdt-"+s).textContent=cd>0?Math.ceil(cd):on?Math.ceil(eff[id]):"";
  }
}

/* ---------- 칭호 선택 (처음에 한 번, 바꿀 수 없음) ---------- */
function openTitlePick(){
  var h='<div class="panel gold"><p class="banner" style="margin-bottom:4px">칭호를 골라 주세요</p>'+
    '<p style="margin:0 0 14px;text-align:center;color:var(--red);font-family:var(--f-d);font-size:15px">한 번 정하면 바꿀 수 없어요. 신중하게 골라요!</p><div style="display:flex;flex-direction:column;gap:16px;padding:0 4px">';
  TITLES.forEach(function(t){
    h+='<button class="tcard'+(pickSel===t.id?" sel":"")+'" data-a="tsel" data-v="'+t.id+'"><div class="th">'+spr(t.e,18,2.4)+'<div style="min-width:0"><div class="tn">'+t.n+'</div><span class="chip">'+t.tag+'</span></div></div>'+
      '<span class="sub">'+t.line+'</span><div class="chips" style="margin:0">'+chipsFx(t.fx)+'</div>'+
      (t.extra.length?'<ul class="sub" style="margin:0;padding-left:18px">'+t.extra.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>":"")+'</button>';
  });
  h+='</div><button class="btn gold wide" style="margin-top:20px" data-a="tok"'+(pickSel?"":" disabled")+'>'+(pickSel?TT[pickSel].n+"(으)로 결정":"칭호를 선택하세요")+'</button></div>';
  showOv(h);
}

/* ---------- 입력 ---------- */
function hardReset(){
  S=fresh();resetArmed=false;afterLoad();boot();cloudSave(true);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-a"),v=b.getAttribute("data-v");
  if(a!=="reset")resetArmed=false;
  if(a==="tab"){tab=v;renderTab();window.scrollTo(0,0);snd(440,0.04,"square",0.025)}
  else if(a==="sub"){var p=v.split(":");sub[p[0]]=p[1];renderTab()}
  else if(a==="cast")useSkill(S.slots[parseInt(v,10)]);
  else if(a==="boss"){enterBoss();uiBattle()}
  else if(a==="tog"){
    if(v==="boss")S.autoBoss=!S.autoBoss;
    else if(v==="skill")S.autoSkill=!S.autoSkill;
    else if(v==="speed")S.speed=nextSpeed();
    else if(v==="auto"){if(!rsLv("auto")){toast("회귀 상점에서 자동 강화를 먼저 해금해 주세요");return}S.ab=!S.ab}
    else S.sfx=!S.sfx;
    save();uiBattle();
    if(!$("ov").hidden&&$("sv-code"))settingsOv($("sv-msg")?$("sv-msg").textContent:"");
  }
  else if(a==="fold"){E.fold=!E.fold;$("top").classList.toggle("min",E.fold);$("b-fold").textContent=E.fold?"펴기":"접기"}
  else if(a==="bm"){BM=parseInt(v,10);uiGrow()}
  else if(a==="up")buyUp(parseInt(v,10));
  else if(a==="pull"){var q=v.split(":");doPull(q[0],parseInt(q[1],10))}
  else if(a==="tbuy")buyTicket(parseInt(v,10));
  else if(a==="equip")equip(v);
  else if(a==="synall"){T.synAll=!T.synAll;renderTab()}
  else if(a==="endnext")finalSeq((T.endPg||0)+1);
  else if(a==="gx"){T.gx=T.gx===v?"":v;renderTab()}
  else if(a==="gf"){T.gf=v;T.gx="";renderTab()}
  else if(a==="sx"){T.sx=T.sx===v?"":v;renderTab()}
  else if(a==="enh")enhance(v);
  else if(a==="enhg")enhance(v,true);
  else if(a==="gprot"){S.gp=!S.gp;save();renderTab()}
  else if(a==="skin")setSkin(v);
  else if(a==="sleq")toggleSkill(v);
  else if(a==="pteq")toggleParty(v);
  else if(a==="ach")claimAch(v);
  else if(a==="mail")mailOv();
  else if(a==="attend")attend();
  else if(a==="settings")settingsOv();
  else if(a==="sexp")exportSave();
  else if(a==="simp")importSave();
  else if(a==="ovx")hideOv();
  else if(a==="tsel"){pickSel=v;openTitlePick()}
  else if(a==="tok"){
    if(!pickSel||S.tl)return;
    S.title=pickSel;S.tl=true;hideOv();
    T.giftT=Math.min(T.giftT,giftDelay());
    toast("칭호 획득: "+TT[S.title].n);jingle([523,784,1046]);
    save();renderTab();uiTop();
  }
  else if(a==="pteq2")togglePet(v);
  else if(a==="stagemv")stageOv();
  else if(a==="stgprev")stgStep(-1);
  else if(a==="stgnext")stgStep(1);
  else if(a==="stgadj")stgAdj(v);
  else if(a==="stggo")stageGo();
  else if(a==="stglock"){var cv=$("st-in")?$("st-in").value:S.stage;S.lock=!S.lock;save();stageOv();if($("st-in"))$("st-in").value=cv}
  else if(a==="koretry")koDecide("retry");
  else if(a==="koback")koDecide("back");
  else if(a==="jobask")jobOv(v);
  else if(a==="jobsel"){T.jobSel=v;jobOv()}
  else if(a==="jobgo")jobGo();
  else if(a==="acct")acctOv();
  else if(a==="accopy")acctCopy();
  else if(a==="acgo")acctGo();
  else if(a==="mq")claimMq();
  else if(a==="shop")shopBuy(v);
  else if(a==="rshop")rsBuy(v);
  else if(a==="help")helpOv();
  else if(a==="spin")spinRoulette();
  else if(a==="dggo")dgStart(v);
  else if(a==="nick")nickOv(true);
  else if(a==="nkset")nickSet();
  else if(a==="rbask")rebirthAsk();
  else if(a==="rbgo")rebirthGo();
  else if(a==="dq")claimDq(v);
  else if(a==="nok")noticeOk();
  else if(a==="coupon")redeem();
  else if(a==="csave"){cloudSave(true).then(function(){var m=$("cl-msg");if(m)m.textContent=cloudTxt()})}
  else if(a==="cload")cloudLoadNow();
  else if(a==="ccload"){if(CCO){S=norm(CCO);CCO=null;cloud.block=false;cloud.sig=progSig();afterLoad();hideOv();toast("클라우드 기록을 불러왔어요")}}
  else if(a==="cckeep"){CCO=null;cloud.block=false;hideOv();cloudSave(true)}
  else if(a==="gift")claimGift();
  else if(a==="ovclose"){hideOv();if(!S.tl)openTitlePick()}
  else if(a==="reset"){
    if(resetArmed){hardReset()}
    else{resetArmed=true;settingsOv()}
  }
});

/* ---------- 시작 ---------- */
function boot(){
  var now=Date.now(),lines=[],petNew=false;
  if(!S.petG){S.petG=true;if(Object.keys(S.pet).length===0){S.pet.coco={n:1,lv:1};if(!S.pets[0])S.pets[0]="coco";petNew=true;refreshCM();paintParty()}}
  if(!S.welcome){
    S.welcome=true;S.tickets+=5;S.lastGift=now;
    showOv('<div class="panel gold"><p class="banner">환영 선물</p><p style="margin:0 0 8px;text-align:center">뽑기권 <b>5장</b>이 도착했어요!</p>'+
      '<p class="sub" style="margin-bottom:14px;text-align:center">화면을 눌러 공격하고, 골드로 능력을 키워 보스를 쓰러뜨리세요. 스킬과 동료는 뽑기에서 만날 수 있어요. 막히면 설정의 「게임 방법」과 화면 위쪽의 「성장 목표」를 따라가 보세요. 먼저 칭호를 하나 골라야 해요.</p><button class="btn gold wide" data-a="ovclose">다음</button></div>');
  }else{
    var away=(now-S.last)/1000;
    if(petNew)lines.push("<b>펫 업데이트!</b> 강아지 <b>초코</b>가 함께하게 됐어요. 뽑기 탭의 「펫」에서 더 많은 펫을 만나 보세요.");
    if(S.m8){S.m8=false;lines.push("<b>전투 업데이트!</b> 몬스터가 반격해요. 능력 강화의 맷집·방어를 기존 레벨에 맞춰 미리 채워 드렸어요.")}
    if(S.migr){S.migr=false;lines.push("<b>업데이트 선물</b>로 뽑기권 10장이 도착했어요!<br>스킬 뽑기(최대 4개 장착)와 동료 파티(최대 3명), 우편함 출석, 업적이 새로 생겼어요.")}
    if(away>=60&&S.gps>0){var g=offGold(away),otk=offTix(away);S.gold+=g;S.tickets+=otk;lines.push("자리를 비운 동안(최대 "+(offCap()/3600)+"시간, 효율 "+Math.round(offEff()*100)+"%) 골드 <b>"+fmt(g)+"</b>"+(otk?"과 뽑기권 <b>"+otk+"장</b>":"")+"을 모았어요.")}
    if(now-S.lastGift>=6*3600*1000){S.tickets+=3;S.lastGift=now;lines.push("깜짝 선물로 뽑기권 <b>3장</b>이 도착했어요!")}
    if(lines.length)showOv('<div class="panel gold"><p class="banner">돌아오신 걸 환영해요</p><p style="margin:0 0 14px;text-align:center">'+lines.join("<br><br>")+'</p><button class="btn gold wide" data-a="ovclose">받기</button></div>');
    else if(!S.tl)openTitlePick();
  }
  if(S.stage%10===0){S.stage--;S.bossReady=true}
  save();
}

  E={field:$("b-field"),enemy:$("b-enemy"),psp:$("b-psp"),fx:$("b-fx"),ename:$("b-name"),scene:$("b-scene"),pts:$("b-pts"),player:$("b-player"),pwk:null,fold:false};

  $("ic-q").innerHTML=spr("🏆",14,1.35);
