<title>이민준 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="이민준 키우기 - 공부하고 싸우며 성장하는 픽셀 아트 방치형 육성 RPG">
<meta name="theme-color" content="#0B0D1E">
<meta property="og:title" content="이민준 키우기">
<meta property="og:description" content="공부하고 싸우며 성장하는 픽셀 아트 방치형 육성 RPG">
<meta property="og:image" content="favicon.png">
<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 픽셀 아트 방치형 RPG. 맨 위에 HUD, 전장, 스킬 슬롯이 고정되고 그 아래 탭 내용이 스크롤된다. 맨 아래에 떠 있는 5탭 독. 하나의 어두운 세계관으로 고정. */
:root{
  color-scheme:dark;
  --ring:#04050C; --bg0:#0B0D1E; --panel:#1C2350; --panel2:#2A3478; --edge:#4A58C8;
  --ink:#F4F6FF; --ink2:#AEB8F0; --ink3:#7683CC;
  --gold:#FFC94A; --gold2:#FF9B1F; --cyan:#5BE8FF; --red:#FF5470; --green:#52E3A4;
  --t-common:#9AA6D6; --t-rare:#4DA3FF; --t-epic:#B07CFF; --t-legend:#FFB62E; --t-trash:#A57F4B; --t-ultra:#FF5C7A;
  --k-C:#9AA6D6; --k-B:#4DA3FF; --k-A:#B07CFF; --k-S:#FFB62E; --k-N:#FF4DD2; --k-U:#FF5C7A; --k-M:#7CFFE8;
  --f-d:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-b:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-p:"Press Start 2P","Do Hyeon","Noto Sans KR",monospace;
  --u:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#0B0D1E}
body{
  margin:0;font-family:var(--f-b);font-size:15px;line-height:1.5;color:var(--ink);
  background-color:var(--bg0);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:8px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));min-height:100%;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg0);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
button:disabled{cursor:not-allowed}
textarea{font:inherit}
.wrap{max-width:560px;margin:0 auto}
.px{font-family:var(--f-p);font-size:10px;letter-spacing:-.5px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-d);font-weight:400}
main{display:flex;flex-direction:column;gap:20px;padding:14px 0 8px}

/* 픽셀 이미지 */
.pxi{display:block;width:calc(var(--n)*var(--u,4px));height:auto;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto}
.pxe{display:block;line-height:1;text-align:center}
.pl{width:calc(var(--n)*var(--pu,3px))}

/* 위쪽 고정 영역 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg0);padding:6px 4px 10px;border-bottom:4px solid var(--ring);margin:0 -4px}
.hud{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.portrait{position:relative;width:48px;height:48px;flex:none;background:#34408F;box-shadow:inset 0 0 0 3px var(--gold),-3px 0 0 0 var(--ring),3px 0 0 0 var(--ring),0 -3px 0 0 var(--ring),0 3px 0 0 var(--ring)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 4%;image-rendering:pixelated;display:block}
.player .pa{height:calc(var(--ah)*.95px*var(--u)/4);width:auto;max-width:none;margin:0 auto}
.skin .pa{height:calc(var(--ah)*.8px);width:auto;max-width:none}
.lvb{position:absolute;left:-4px;bottom:-8px;font-family:var(--f-p);font-size:8px;background:#000;color:var(--gold);padding:2px 4px;box-shadow:0 0 0 2px var(--gold)}
.hud-mid{min-width:0;flex:1}
.hud-name{font-family:var(--f-d);font-size:19px;line-height:1.1;white-space:nowrap;text-shadow:2px 2px 0 #000}
.rib{display:inline-block;max-width:100%;font-family:var(--f-d);font-size:12px;padding:0 7px;background:var(--gold);color:#3a2300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;box-shadow:-2px 0 0 0 var(--ring),2px 0 0 0 var(--ring),0 -2px 0 0 var(--ring),0 2px 0 0 var(--ring)}
.caps{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.cap{display:flex;align-items:center;gap:6px;background:#070918;padding:1px 8px 1px 3px;min-width:108px;box-shadow:-3px 0 0 0 var(--ring),3px 0 0 0 var(--ring),0 -3px 0 0 var(--ring),0 3px 0 0 var(--ring),inset 0 0 0 2px #2B3580}
.cap .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.cap .ic .pxi{--u:1.3px}
.cap .px{flex:1;text-align:right}

/* 패널 */
.panel{background:var(--panel);padding:14px;min-width:0;box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -4px 0 rgba(0,0,0,.3),-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.panel.gold{box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -4px 0 rgba(0,0,0,.3),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold)}
.h2{font-family:var(--f-d);font-size:19px;margin:0 0 8px;font-weight:400;display:flex;align-items:center;gap:8px;text-shadow:2px 2px 0 #000}
.h2::before{content:"";width:8px;height:18px;background:var(--gold);box-shadow:inset -3px 0 0 var(--gold2)}
.sub{color:var(--ink2);font-size:13px;margin:0}

/* 버튼 */
.btn{border:0;border-radius:0;padding:10px 14px;font-family:var(--f-d);font-size:15px;color:#fff;background:#3F5BE0;text-shadow:1px 1px 0 rgba(0,0,0,.5);box-shadow:inset 0 4px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.35),-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.btn:active:not(:disabled){transform:translateY(3px);filter:brightness(1.1)}
.btn:disabled{filter:grayscale(.9) brightness(.65)}
.btn.gold{color:#3a2300;background:var(--gold);text-shadow:none}
.btn.hot{background:#E03A5E}
.btn.ghost{background:#2A3376;color:var(--ink)}
.btn.ghost.on{background:#5A4A12;color:var(--gold);box-shadow:inset 0 4px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.35),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold)}
.btn.small{padding:6px 11px;font-size:14px}
.btn.wide{width:100%}
.btn small{font-family:var(--f-b);font-size:11.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.subtabs{display:flex;gap:14px;padding:0 4px;flex-wrap:wrap}
.chip{display:inline-block;padding:0 7px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);color:var(--ink)}
.chip i{font-style:normal;color:var(--c)}
.chip.neg{color:var(--red)}
.bar{height:14px;background:#070918;box-shadow:inset 0 0 0 2px #000;padding:2px}
.bar>i{display:block;height:100%;background:var(--c1,#7C8DFF);width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:2px solid rgba(255,255,255,.08);vertical-align:top}
th{font-size:12px;color:var(--ink3);font-weight:700}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.bt th,.bt td{white-space:nowrap;padding:7px 4px;font-size:12.5px}
.tier{display:inline-block;color:#fff;background:var(--tc);padding:0 8px;font-size:11px;font-weight:700}
.t-common{--tc:var(--t-common)} .t-rare{--tc:var(--t-rare)} .t-epic{--tc:var(--t-epic)} .t-legend{--tc:var(--t-legend)} .t-trash{--tc:var(--t-trash)} .t-ultra{--tc:var(--t-ultra)}
.k-C{--tc:var(--k-C)} .k-B{--tc:var(--k-B)} .k-A{--tc:var(--k-A)} .k-S{--tc:var(--k-S)} .k-N{--tc:var(--k-N)} .k-U{--tc:var(--k-U)} .k-M{--tc:var(--k-M)} .t-pet{--tc:#FFB62E}
.tier.k-N,.tier.k-U{animation:rb 1.2s steps(6) infinite}
.tier.k-M{background:linear-gradient(90deg,#FF5C7A,#FFC94A,#52E3A4,#4DA3FF,#B07CFF);color:#fff;animation:rb 1.2s steps(6) infinite}
.pcard.k-M::after{content:"";position:absolute;inset:-4px;border:4px solid #7CFFE8;animation:rb 1.2s steps(6) infinite;pointer-events:none}
.tier.t-legend,.tier.k-S{color:#3a2300}
.tier.t-ultra{background:#FF5C7A;animation:rb 1.2s steps(6) infinite}
.link{background:none;border:0;color:var(--ink3);text-decoration:underline;font-size:13px;padding:4px}

/* 전장 */
.field{position:relative;height:220px;overflow:hidden;background:#243;border:4px solid #4A58C8;margin:4px 4px 0;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;box-shadow:-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.field.boss{border-color:var(--red)}
.field.buffed{border-color:var(--gold)}
.field.shk{animation:fshake .3s steps(5)}
.top.min .field{display:none}
@keyframes fshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.scn{position:absolute;inset:0;background-size:cover;background-position:50% 100%;image-rendering:pixelated;image-rendering:crisp-edges}
.pts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;bottom:-10px;width:4px;height:4px;background:#fff;opacity:.8;animation:float 7s steps(28) infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-300px) translateX(24px);opacity:0}}
.fh{position:absolute;left:44px;right:44px;top:6px;text-align:center;pointer-events:none}
.fstage{background:none;border:0;padding:0;margin:0;pointer-events:auto;cursor:pointer;font-family:var(--f-p);font-size:13px;line-height:1;color:#fff;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px -3px #000,3px -3px #000,-3px 3px #000}
.fphase{font-family:var(--f-d);font-size:12.5px;color:#fff;text-shadow:2px 2px 0 #000;margin-top:4px}
.pips{display:flex;gap:4px;justify-content:center;margin-top:4px}
.pips span{width:10px;height:10px;background:#000;box-shadow:inset 0 0 0 2px #888}
.pips span.on{background:var(--gold);box-shadow:inset 0 0 0 2px #fff}
.tm{margin:5px auto 0;width:78%;height:16px;background:#000;position:relative;box-shadow:inset 0 0 0 2px #fff}
.tm i{position:absolute;left:3px;top:3px;bottom:3px;width:calc(100% - 6px);background:var(--red)}
.tm b{position:absolute;inset:0;text-align:center;font-family:var(--f-d);font-weight:400;font-size:11.5px;line-height:16px;color:#fff;text-shadow:1px 1px 0 #000}
.fboss{position:absolute;left:50%;transform:translateX(-50%);top:78px;z-index:2}
.ficons{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fib{position:relative;width:32px;height:32px;padding:0;border:0;border-radius:0;background:rgba(0,0,0,.6);display:grid;place-items:center;box-shadow:inset 0 0 0 2px #fff}
.fib .pxi{--u:1.35px}
.fib:active{transform:translateY(2px)}
.dot{display:inline-block;width:10px;height:10px;background:var(--red);box-shadow:0 0 0 2px #000;position:absolute;top:-4px;right:-4px}
.party{position:absolute;left:2%;bottom:7%;width:56%;height:120px;pointer-events:none}
.pm{position:absolute;--pu:calc(var(--u)*.42);animation:bob 1s steps(2) infinite}
.pm0{left:0;bottom:26px;animation-delay:-.3s}.pm1{left:34px;bottom:6px;animation-delay:-.6s}.pm2{left:68px;bottom:30px}
.pm .pet{position:absolute;right:-18px;bottom:0}
.pm .pet .pxi{--u:1.4px}
.player{--k:.62;--pu:calc(var(--u)*var(--k));position:absolute;left:104px;bottom:0;text-align:center;pointer-events:none}
.player[data-ph="0"]{--k:.46}.player[data-ph="1"]{--k:.52}.player[data-ph="2"]{--k:.58}.player[data-ph="3"]{--k:.64}.player[data-ph="4"]{--k:.68}.player[data-ph="5"]{--k:.7}.player[data-ph="6"]{--k:.72}.player[data-ph="7"]{--k:.76}
.player .sprite{display:block;animation:bob 1s steps(2) infinite}
.player.dash .sprite{animation:bob .35s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pshadow{width:54px;height:8px;background:rgba(0,0,0,.4);margin:-5px auto 0}
.pw{position:absolute;right:-16px;top:30px}
.pw .pxi{--u:1.6px;transform:rotate(-20deg)}
.enemy{position:absolute;right:3%;bottom:7%;width:196px;height:168px;pointer-events:none}
.ehpw{position:absolute;right:40px;top:26px;width:112px;text-align:center}
.ename{font-family:var(--f-d);font-size:12px;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ehp{position:relative;height:16px;background:#000;box-shadow:inset 0 0 0 2px #fff;padding:3px}
.ehp>i{--c1:var(--red)}
.ehp .hpt{position:absolute;inset:0;font-family:var(--f-p);font-size:7px;line-height:16px;color:#fff;text-shadow:1px 1px 0 #000}
.wave{position:absolute;right:0;bottom:0;width:196px;height:120px}
.en{position:absolute;bottom:0}
.en .sprite{display:block;animation:bob 1.1s steps(2) infinite}
.e0{right:0;--u:3.2px}.e1{right:66px;bottom:8px;--u:2.6px}.e2{right:118px;bottom:16px;--u:2.2px}
.field.boss .e0{--u:3.6px}
.en.gone{visibility:hidden}
.enemy.hit .e0 .sprite{animation:ehit .14s steps(2)}
@keyframes ehit{0%{transform:translateX(0)}30%{transform:translateX(8px)}100%{transform:translateX(0)}}
.eshadow{position:absolute;right:6px;bottom:-4px;width:84px;height:8px;background:rgba(0,0,0,.4)}
.combo{position:absolute;left:10px;bottom:6px;font-family:var(--f-p);font-size:10px;color:#FFE27A;text-shadow:2px 2px 0 #000;pointer-events:none;min-height:14px}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;font-family:var(--f-p);font-size:10px;color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;animation:rise .75s steps(8) forwards;white-space:nowrap}
.dmg.crit{color:#FFD24A;font-size:14px}
.dmg.fr{font-size:9px;color:#FFD9B8}
.dmg.gold{color:#FFE27A}
.dmg.big{font-size:18px;color:#FF9DB3}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-54px)}}
.shot{position:absolute;width:14px;height:14px;background:#8FF;box-shadow:0 0 0 4px #1AA3FF,0 0 0 8px rgba(26,163,255,.35);animation:shot .22s steps(5) forwards}
.shot.c{background:#FFF3A8;box-shadow:0 0 0 4px #FFB62E,0 0 0 8px rgba(255,182,46,.35)}
.shot.t{width:20px;height:20px;background:#C7FFFD;box-shadow:0 0 0 4px #4DE1FF,0 0 0 8px rgba(77,225,255,.35)}
.shot.m{width:28px;height:28px;background:#FFD0F0;box-shadow:0 0 0 4px #FF5D8F,0 0 0 8px rgba(255,93,143,.35)}
@keyframes shot{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:.3}}
.ban{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--f-p);font-size:18px;color:#FFE27A;text-shadow:4px 0 #000,-4px 0 #000,0 4px #000,0 -4px #000,4px 4px #000,-4px -4px #000,4px -4px #000,-4px 4px #000;animation:ban 1.5s steps(10) forwards}
.ban.bad{color:#FF8CA4}
@keyframes ban{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* 스킬 슬롯 */
.sbar{display:grid;grid-template-columns:repeat(4,1fr) 52px;gap:12px;padding:12px 8px 0;align-items:start}
.skw{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.skb{position:relative;width:100%;max-width:60px;aspect-ratio:1;border:0;border-radius:0;padding:0;overflow:hidden;background:#2B3580;box-shadow:inset 0 0 0 3px var(--tc,#6677E8),-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.skb .e{position:absolute;inset:0;display:grid;place-items:center}
.skb .e .pxi{--u:2.4px}
.skb .cdm{position:absolute;left:0;right:0;top:0;height:0;background:rgba(0,0,0,.72)}
.skb .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-p);font-size:12px;color:#fff;text-shadow:2px 2px 0 #000}
.skb .tg{position:absolute;left:3px;top:2px;font-family:var(--f-p);font-size:8px;color:var(--tc);text-shadow:1px 1px 0 #000}
.skb:active:not(:disabled){transform:translateY(3px)}
.skb.rdy{animation:pulse .8s steps(2) infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.skb.act{background:#8A5A08}
.skb.emp{background:#10153A;box-shadow:inset 0 0 0 3px #2B3580,-4px 0 0 0 var(--ring),4px 0 0 0 var(--ring),0 -4px 0 0 var(--ring),0 4px 0 0 var(--ring)}
.skb.emp .e{font-family:var(--f-p);font-size:16px;color:#4A58C8}
.skn{font-family:var(--f-d);font-size:11.5px;text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sside{display:flex;flex-direction:column;gap:8px}
.mini{height:24px;border:0;border-radius:0;padding:0;font-family:var(--f-p);font-size:8px;color:var(--ink2);background:#2A3376;box-shadow:-3px 0 0 0 var(--ring),3px 0 0 0 var(--ring),0 -3px 0 0 var(--ring),0 3px 0 0 var(--ring)}
.mini.on{background:#5A4A12;color:var(--gold)}

/* 스탯 */
.cp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cpn{font-family:var(--f-p);font-size:15px;line-height:1.2;color:var(--gold);text-shadow:3px 3px 0 #000}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.st{background:#10153A;padding:7px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;box-shadow:inset 0 0 0 2px #000}

.st b{font-family:var(--f-d);font-weight:400;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}

/* 성장 */
.up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid rgba(255,255,255,.08)}
.up:last-child{border-bottom:0}

function prDesc(p,lv){
  var k=1+0.15*(lv||0);

  if(p.k==="dodge")return p.n+": 몬스터 공격을 "+f1(p.v*k)+"% 확률로 회피";
  if(p.k==="reflect")return p.n+": 받는 피해의 "+f1(p.v*k)+"%를 반사";
  if(p.k==="revive")return p.n+": 쓰러지면 체력 "+Math.round(Math.min(80,p.v+3*(lv||0)))+"%로 부활 (재사용 90초)";

  if(p.k==="gb")return p.n+": 처치 시 "+f1(p.c*k)+"% 확률로 골드 ×"+p.m;
  if(p.k==="heal")return p.n+": 피격 시 "+f1(p.c*k)+"% 확률로 체력 "+p.v+"% 회복";
  return p.n;
}

function fmt(n){
  if(!isFinite(n))return "∞";
  n=Math.floor(n);
  if(n<10000)return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  var i=0,x=n;
  while(x>=10000&&i<NU.length-1){x/=10000;i++}
  if(x>=10000)return n.toExponential(2).replace("e+","e");
  var s=x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2);

}

/* ---------- 전투: 몬스터 반격 ---------- */
var REFG=1.2,MK_N=0.04,MK_B=0.07,MK_M=0.1;
function mDmgAt(st,boss,major){return 100*Math.pow(REFG,st-1)*(boss?(major?MK_M:MK_B):MK_N)*Math.min(1,(st+3)/20)}
function gearProcs(){
  var o={burst:[],dodge:0,reflect:0,revive:0,killheal:0,gb:null,heal:null};
  SLOTS.forEach(function(sl){
    var id=S.equip[sl];if(!id||!S.inv[id])return;
    var it=ITEM[id];if(!it||!it.pr)return;
    var lv=S.inv[id].lv||0,k=1+0.15*lv,p=it.pr;
    if(p.k==="burst")o.burst.push({c:p.c*k,m:p.m,n:p.n,e:p.e});
    else if(p.k==="dodge")o.dodge+=p.v*k;
    else if(p.k==="reflect")o.reflect+=p.v*k;
    else if(p.k==="revive")o.revive=Math.max(o.revive,Math.min(80,p.v+3*lv));
    else if(p.k==="killheal")o.killheal+=p.v*k;
    else if(p.k==="gb")o.gb={c:p.c*k,m:p.m,n:p.n};
    else if(p.k==="heal")o.heal={c:p.c*k,v:p.v,n:p.n};
  });
  o.dodge=Math.min(40,o.dodge);o.reflect=Math.min(80,o.reflect);
  return o;
}
function healP(p){T.hp=Math.min(T.hpMax,T.hp+T.hpMax*p/100)}
function hurtFx(d,big){
  popAt("-"+fmt(d),big?"hurt big":"hurt",0.24,0.5);
  if(E.enemy){E.enemy.classList.remove("atk");void E.enemy.offsetWidth;E.enemy.classList.add("atk")}
  if(E.player){E.player.classList.remove("hurt");void E.player.offsetWidth;E.player.classList.add("hurt")}
  snd(160,0.08,"sawtooth",0.025,90);
}
function enemyAttack(dt,c){
  if(SFc.charm||T.revolt>0)return;
  var boss=F.boss,iv=boss?1.2:1.8,n=0;
  F.at+=dt;
  while(F&&F.at>=iv&&n<4){
    F.at-=iv;n++;F.hn++;
    var big=boss&&F.hn%4===0,pr=gearProcs();
    if(pr.dodge>0&&Math.random()*100<pr.dodge){popAt("회피!","gold",0.26,0.55);continue}
    var raw=mDmgAt(S.stage,boss,F.major)*(big?2:1);
    var d=Math.max(1,raw*(1-c.dr)*SFc.dr*(1-CMc.sponge));
    T.hp-=d;
    hurtFx(d,big);
    if(pr.reflect>0&&F){var rd=raw*pr.reflect/100;popAt("반사 "+fmt(rd),"big",0.7,0.5);deal(rd)}
    if(pr.heal&&Math.random()*100<pr.heal.c){healP(pr.heal.v);popAt(pr.heal.n+" +"+pr.heal.v+"%","gold",0.26,0.7)}
    if(T.hp<=0){playerDown();return}
  }
}
function playerDown(){
  var c=calc(),pr=gearProcs();
  if(pr.revive>0&&T.revT<=0){
    T.hp=c.hp*pr.revive/100;T.revT=90;
    bannerFx("부활!");toast("용사의 의지! 체력 "+Math.round(pr.revive)+"%로 부활했어요");jingle([523,784,1046]);
    return;
  }
  S.dth=(S.dth||0)+1;T.hp=c.hp*0.5;
  bannerFx("KO",true);snd(300,0.4,"sawtooth",0.04,80);
  if(F&&F.boss&&!F.dungeon){
    toast(F.name+"에게 쓰러졌어요! 같은 보스에 재도전할 수 있어요");
    T.ko={t:12};kills=0;F=null;
    return;
  }
  T.koN++;kills=0;F=null;T.spawnT=3;
  if(T.koN>=3&&S.stage>1&&(S.stage-1)%10!==0&&!S.lock){S.stage--;T.koN=0;toast("연달아 쓰러져서 한 스테이지 물러났어요. 맷집·방어를 올려 보세요")}
  else toast("쓰러졌어요. 잠시 쉬고 같은 스테이지에서 다시 싸워요");
}
function deal(d){
  if(!F||F.inv>0)return;
  d*=SFc.dmgM*(F.armor||1);
  if(F.dungeon){DG.dmg+=d;return}
  F.hp-=d;
  if(F.awk&&!F.awoke&&F.hp<F.max*0.5&&F.hp>0){F.awoke=true;F.inv=3;F.hp=F.max*0.5;bannerFx("각성!",true)}
  if(F.hp<=0)kill();
}
function flashHit(){
  if(E.enemy){E.enemy.classList.remove("hit");void E.enemy.offsetWidth;E.enemy.classList.add("hit")}
}
function hit(c){
  var cr=Math.random()<c.cc,d=c.atk*(cr?c.cd:1)*rnd(0.92,1.08);
  deal(d);
  if(F){
    var bp=gearProcs().burst;
    for(var bi=0;bi<bp.length;bi++){
      if(Math.random()*100<bp[bi].c&&F){var bd=c.atk*bp[bi].m;popAt(bp[bi].n+" "+fmt(bd),"big",0.62,0.62);fxSpr(bp[bi].e,14,2.6,"pop",70,34,0.7);deal(bd)}
    }
  }
  if(F&&c.bz>0&&Math.random()<c.bz){var d2=c.atk*4;popAt("광란! "+fmt(d2),"big",0.6,0.55);deal(d2)}
  if(T.hitFx<=0&&E.fx){
    T.hitFx=0.14;
    popAt(fmt(d),cr?"crit":"",rnd(0.62,0.82),rnd(0.3,0.5));
    shoot(cr?"c":"n");
    flashHit();
  }
}
function tap(){
  if(!F||paused())return;
  var c=calc();
  T.combo++;T.comboT=1.0;
  var bon=1+Math.min(1,T.combo*0.02);
  var cr=Math.random()<c.cc,d=c.atk*bon*(cr?c.cd:1);
  deal(d);
  popAt(fmt(d),cr?"crit":"",rnd(0.6,0.85),rnd(0.25,0.5));
  shoot("t");
  flashHit();
  if(T.sndT<=0){T.sndT=0.06;if(cr)snd(700,0.1,"square",0.04,1100);else snd(320,0.06,"square",0.03,170)}
}
function useSkill(id){
  var sk=SKM[id];
  if(!sk||!S.skl[id]||cds[id]>0||!F)return;
  var lv=S.skl[id].lv,p=sPow(id),c=calc();
  cds[id]=sk.cd*(1-cdCut());dqAdd("s",1);S.skt=(S.skt||0)+1;
  try{skillFx(id)}catch(e){}
  if(sk.nuke){
    var d=nukeDmg(sk,c,p);
    popAt(fmt(d),"big",0.7,0.22);
    shoot("m");
    if(E.field){E.field.classList.add("shk");setTimeout(function(){if(E.field)E.field.classList.remove("shk")},320)}
    snd(200,0.3,"sawtooth",0.05,900);
    toast(sk.n+"!");
    deal(d);
  }
  if(sk.cdr){
    var cut=sk.cdr*p;
    SKL.forEach(function(o){if(o.id!==id&&cds[o.id]>0)cds[o.id]=Math.max(0,cds[o.id]-cut)});
    toast(sk.n+": 다른 스킬 대기시간 −"+f1(cut)+"초");snd(600,0.15,"square",0.04,900);
  }
  if(sk.buff){
    eff[id]=sk.dur*(1+0.1*(eLv(lv,5,0.25)-1))*(1+SYc.dur/100);
    refreshSF();
    toast(sk.n+" 발동!");snd(500,0.2,"square",0.04,1000);
  }
}
function autoSkills(){
  if(!S.autoSkill||!F)return;
  var c=calc();
  S.slots.forEach(function(id){
    if(!id||!F)return;
    var sk=SKM[id];
    if(!sk||!S.skl[id]||cds[id]>0)return;
    var p=sPow(id);
    if(sk.t==="N"&&!F.boss)return;
    if(sk.nuke){if(!F.boss&&F.hp<nukeDmg(sk,c,p)*0.7)return}
    else if(sk.cdr){
      var need=S.slots.some(function(o){return o&&o!==id&&cds[o]>0});
      if(!need)return;
    }
    else if(sk.buff&&sk.buff.freeze){if(!F.boss)return}
    else{if(!F.boss&&F.hp<c.atk*c.spd*6)return}
    useSkill(id);
  });
}

}

/* 성장 단계에 맞춰 높은 등급 비중을 조절한다 */
function earlyF(){var b=S.best;return b<10?0.15:b<20?0.4:b<40?0.7:b<60?0.9:1}
function adjPool(pool){
  var f=earlyF(),extra=0,out=pool.map(function(t){
    var p=t.p;
    if(t.rank>=3){var a=p*f;extra+=p-a;p=a}
    else if(t.rank===2){var r=p*(0.5+0.5*f);extra+=p-r;p=r}
    return {t:t,p:p};
  });
  var tg=null;
  out.forEach(function(o){if(o.t.sink)tg=o});
  if(!tg)out.forEach(function(o){if(!tg||o.t.rank<tg.t.rank)tg=o});
  tg.p+=extra;
  return out;
}
function rollTier(pool){
  var adj=adjPool(pool),tot=0;
  adj.forEach(function(o){tot+=o.p});
  var r=Math.random()*tot;
  for(var i=0;i<adj.length;i++){r-=adj[i].p;if(r<0)return adj[i].t}
  return adj[adj.length-1].t;
}
function pullOne(pool){
  S.pity++;
  var t=(S.pity>=100&&S.best>=30)?TI.ultra:rollTier(pool||TIERS);
  if(t.id==="ultra")S.pity=0;
  var list=ITEMS.filter(function(i){return i.t===t.id});
  var it=pickRand(list),own=S.inv[it.id],isNew=false,sh=0;
  if(!own){S.inv[it.id]={n:1,lv:0};isNew=true}
  else{own.n++;sh=t.sh;S.shards+=sh}
  S.pulls++;
  return {id:it.id,t:it.t,isNew:isNew,up:false,sh:sh};
}
function pullSk(pool){
  S.pit.sk++;S.pit.skn++;
  var t=(S.pit.skn>=300&&S.best>=30)?SKTI.N:(S.pit.sk>=60&&S.best>=30)?SKTI.S:rollTier(pool||SKTIERS);
  if(t.id==="S"||t.id==="N")S.pit.sk=0;
  if(t.id==="N")S.pit.skn=0;
  var sk=pickRand(SKL.filter(function(s){return s.t===t.id})),own=S.skl[sk.id],isNew=false,up=false,sh=0;
  if(!own){
    S.skl[sk.id]={n:1,lv:1};isNew=true;
    var ei=S.slots.indexOf(null);if(ei>=0&&!(sk.t==="N"&&S.slots.some(function(x){return x&&SKM[x]&&SKM[x].t==="N"})))S.slots[ei]=sk.id;
  }else{
    own.n++;
    if(own.lv<SKMAX){own.lv++;up=true}else{sh=t.sh;S.shards+=sh}
  }
  return {id:sk.id,t:t.id,isNew:isNew,up:up,sh:sh};
}
function pullCm(pool){
  S.pit.cm++;S.pit.cmu++;S.pit.cmm++;
  var t=(S.pit.cmm>=400&&S.best>=30)?CMTI.M:(S.pit.cmu>=150&&S.best>=30)?CMTI.U:(S.pit.cm>=40&&S.best>=30)?CMTI.S:rollTier(pool||CMTIERS);
  if(t.id==="S"||t.id==="U"||t.id==="M")S.pit.cm=0;
  if(t.id==="U"||t.id==="M")S.pit.cmu=0;
  if(t.id==="M")S.pit.cmm=0;
  var cl=CM.filter(function(s){return (s.bt||s.t)===t.id});
  if(t.id==="C")cl=cl.concat([CMM.dohyeon,CMM.dohyeon]);
  var cm=pickRand(cl),own=S.cmp[cm.id],isNew=false,up=false,sh=0;
  if(!own){

    var ei=S.party.indexOf(null);if(ei>=0){S.party[ei]=cm.id;refreshCM();paintParty()}

  return {id:cm.id,t:t.id,isNew:isNew,up:up,sh:sh};
}
function doPull(kind,n){
  if(S.tickets<n)return;

  var res=[],tiers=tiersOf(kind),strong=tiers.filter(function(t){return t.rank>=2});
  var fn=kind==="sk"?pullSk:kind==="cm"?pullCm:kind==="pt"?pullPt:pullOne;

function step(dt){
  SKL.forEach(function(sk){
    if(cds[sk.id]>0)cds[sk.id]=Math.max(0,cds[sk.id]-dt);
    if(eff[sk.id]>0)eff[sk.id]=Math.max(0,eff[sk.id]-dt);
  });
  refreshSF();refreshEV();
  if(S.stage>S.rbest)S.rbest=S.stage;
  if(S.sm<Math.floor(S.best/10))milestone();
  if(S.ab&&rsLv("auto")>0){T.abT=(T.abT||0)+dt;if(T.abT>=1){T.abT=0;autoBuy()}}
  var c=calc();
  if(T.hp<0)T.hp=c.hp;
  if(T.hpMax>0&&c.hp>T.hpMax)T.hp+=c.hp-T.hpMax;
  T.hpMax=c.hp;
  T.hp=Math.min(c.hp,T.hp+c.hp*c.rg*dt);
  if(T.revT>0)T.revT-=dt;
  if(T.revolt>0)T.revolt-=dt;
  T.eggT=(T.eggT||0)+dt;if(T.eggT>2){T.eggT=0;eggCheck()}
  if(T.hitFx>0)T.hitFx-=dt;
  if(T.sndT>0)T.sndT-=dt;
  if(T.combo>0){T.comboT-=dt;if(T.comboT<=0)T.combo=0}
  if(!F){if(T.ko){T.ko.t-=dt;if(T.ko.t<=0)koDecide("back")}else{T.spawnT-=dt;if(T.spawnT<=0)spawn()}}
  else{
    T.acc+=dt*c.spd;var n=0;
    while(T.acc>=1&&n<12&&F){T.acc-=1;n++;hit(c)}
    if(F){
      var ps=c.fr+c.pd+c.atk*SFc.dot;
      if(ps>0){
        var d=ps*dt;T.fAcc+=d;T.fT+=dt;deal(d);
        if(T.fT>=0.7){
          popAt(fmt(T.fAcc),"fr",0.12,0.22);
          T.fAcc=0;T.fT=0;
        }
      }
    }
    if(F&&F.boss){
      if(F.dungeon){F.t-=dt;if(F.t<=0)dgEnd()}
      else{
        if(F.inv>0)F.inv-=dt;
        if(F.regen)F.hp=Math.min(F.max,F.hp+F.max*F.regen*dt);
        if(CMc.heal>0){T.healT+=dt;if(T.healT>=12){T.healT=0;F.t=Math.min(F.tmax,F.t+CMc.heal);popAt("+"+f1(CMc.heal)+"초","gold",0.3,0.6)}}
        if(!SFc.freeze)F.t-=dt;
        if(F.t<=0)bossTimeout();
      }
    }else if(F&&F.gold){F.t-=dt;if(F.t<=0){toast("황금 몬스터가 도망갔어요!");F=null;T.spawnT=0.3}}
  }
  if(F&&!F.dungeon&&!F.gold)enemyAttack(dt,c);
  autoSkills();
  if(!G){
    T.giftT-=dt;
    if(T.giftT<=0){G={t:20};$("gift").hidden=false}
  }else{
    G.t-=dt;
    if(G.t<=0){G=null;T.giftT=giftDelay();$("gift").hidden=true}
  }
  T.gpsT+=dt;
  if(T.gpsT>=2){S.gps=S.gps*0.8+(T.gpsG/T.gpsT)*0.2;T.gpsG=0;T.gpsT=0}
  T.saveT+=dt;
  if(T.saveT>=4){T.saveT=0;save()}
}
function tick(){
  var now=performance.now(),raw=(now-T.last)/1000;T.last=now;
  if(toastT>0){toastT-=Math.min(0.5,raw);if(toastT<=0)$("toast").hidden=true}
  dqRoll();netTick(raw);
  if(paused())return;
  var dt=Math.min(0.5,raw)*S.speed;
  if(raw>6&&S.gps>0){
    var g=offGold(raw),otk=offTix(raw);S.gold+=g;S.tickets+=otk;
    toast("자리를 비운 동안 골드 "+fmt(g)+(otk?" · 뽑기권 "+otk+"장":"")+" 획득");
  }
  step(dt);
  uiTop();
  uiBattle();
  if(tab==="char"&&sub.char==="up")uiGrow();
  else if(tab==="char"&&sub.char==="info")uiInfo();
  else if(tab==="gacha")uiGacha();
}

  else if(a==="boss"){enterBoss();uiBattle()}
  else if(a==="tog"){
    if(v==="boss")S.autoBoss=!S.autoBoss;
    else if(v==="skill")S.autoSkill=!S.autoSkill;
    else if(v==="speed")S.speed=nextSpeed();
    else if(v==="auto"){if(!rsLv("auto")){toast("회귀 상점에서 자동 강화를 먼저 해금해 주세요");return}S.ab=!S.ab}
    else S.sfx=!S.sfx;
    save();uiBattle();
    if(!$("ov").hidden&&$("sv-code"))settingsOv($("sv-msg")?$("sv-msg").textContent:"");
  }
  else if(a==="fold"){E.fold=!E.fold;$("top").classList.toggle("min",E.fold);$("b-fold").textContent=E.fold?"펴기":"접기"}
  else if(a==="bm"){BM=parseInt(v,10);uiGrow()}
  else if(a==="up")buyUp(parseInt(v,10));
  else if(a==="pull"){var q=v.split(":");doPull(q[0],parseInt(q[1],10))}
  else if(a==="tbuy")buyTicket(parseInt(v,10));
  else if(a==="equip")equip(v);
  else if(a==="enh")enhance(v);
  else if(a==="enhg")enhance(v,true);
  else if(a==="gprot"){S.gp=!S.gp;save();renderTab()}
  else if(a==="skin")setSkin(v);
  else if(a==="sleq")toggleSkill(v);
  else if(a==="pteq")toggleParty(v);
  else if(a==="ach")claimAch(v);
  else if(a==="mail")mailOv();
  else if(a==="attend")attend();
  else if(a==="settings")settingsOv();
  else if(a==="sexp")exportSave();
  else if(a==="simp")importSave();
  else if(a==="ovx")hideOv();
  else if(a==="tsel"){pickSel=v;openTitlePick()}
  else if(a==="tok"){
    if(!pickSel||S.tl)return;
    S.title=pickSel;S.tl=true;hideOv();
    T.giftT=Math.min(T.giftT,giftDelay());
    toast("칭호 획득: "+TT[S.title].n);jingle([523,784,1046]);
    save();renderTab();uiTop();
  }
  else if(a==="pteq2")togglePet(v);
  else if(a==="stagemv")stageOv();
  else if(a==="stgadj")stgAdj(v);
  else if(a==="stggo")stageGo();
  else if(a==="stglock"){var cv=$("st-in")?$("st-in").value:S.stage;S.lock=!S.lock;save();stageOv();if($("st-in"))$("st-in").value=cv}
  else if(a==="koretry")koDecide("retry");
  else if(a==="koback")koDecide("back");
  else if(a==="jobask")jobOv();
  else if(a==="jobsel"){T.jobSel=v;jobOv()}
  else if(a==="jobgo")jobGo();
  else if(a==="acct")acctOv();
  else if(a==="accopy")acctCopy();
  else if(a==="acgo")acctGo();
  else if(a==="mq")claimMq();
  else if(a==="shop")shopBuy(v);
  else if(a==="rshop")rsBuy(v);
  else if(a==="help")helpOv();
  else if(a==="spin")spinRoulette();
  else if(a==="dggo")dgStart();
  else if(a==="nick")nickOv(true);
  else if(a==="nkset")nickSet();
  else if(a==="rbask")rebirthAsk();
  else if(a==="rbgo")rebirthGo();
  else if(a==="dq")claimDq(v);
  else if(a==="nok")noticeOk();
  else if(a==="coupon")redeem();
  else if(a==="csave"){cloudSave(true).then(function(){var m=$("cl-msg");if(m)m.textContent=cloudTxt()})}
  else if(a==="cload")cloudLoadNow();
  else if(a==="ccload"){if(CCO){S=norm(CCO);CCO=null;cloud.block=false;cloud.sig=progSig();afterLoad();hideOv();toast("클라우드 기록을 불러왔어요")}}
  else if(a==="cckeep"){CCO=null;cloud.block=false;hideOv();cloudSave(true)}
  else if(a==="gift")claimGift();
  else if(a==="ovclose"){hideOv();if(!S.tl)openTitlePick()}
  else if(a==="reset"){
    if(resetArmed){hardReset()}
    else{resetArmed=true;settingsOv()}
  }
});

/* ---------- 시작 ---------- */
function boot(){
  var now=Date.now(),lines=[],petNew=false;
  if(!S.petG){S.petG=true;if(Object.keys(S.pet).length===0){S.pet.coco={n:1,lv:1};if(!S.pets[0])S.pets[0]="coco";petNew=true;refreshCM();paintParty()}}
  if(!S.welcome){
    S.welcome=true;S.tickets+=5;S.lastGift=now;
    showOv('<div class="panel gold"><p class="banner">환영 선물</p><p style="margin:0 0 8px;text-align:center">뽑기권 <b>5장</b>이 도착했어요!</p>'+
      '<p class="sub" style="margin-bottom:14px;text-align:center">화면을 눌러 공격하고, 골드로 능력을 키워 보스를 쓰러뜨리세요. 스킬과 동료는 뽑기에서 만날 수 있어요. 막히면 설정의 「게임 방법」과 화면 위쪽의 「성장 목표」를 따라가 보세요. 먼저 칭호를 하나 골라야 해요.</p><button class="btn gold wide" data-a="ovclose">다음</button></div>');
  }else{
    var away=(now-S.last)/1000;
    if(petNew)lines.push("<b>펫 업데이트!</b> 강아지 <b>코코</b>가 함께하게 됐어요. 뽑기 탭의 「펫」에서 더 많은 펫을 만나 보세요.");
    if(S.m8){S.m8=false;lines.push("<b>전투 업데이트!</b> 몬스터가 반격해요. 능력 강화의 맷집·방어를 기존 레벨에 맞춰 미리 채워 드렸어요.")}
    if(S.migr){S.migr=false;lines.push("<b>업데이트 선물</b>로 뽑기권 10장이 도착했어요!<br>스킬 뽑기(최대 4개 장착)와 동료 파티(최대 3명), 우편함 출석, 업적이 새로 생겼어요.")}
    if(away>=60&&S.gps>0){var g=offGold(away),otk=offTix(away);S.gold+=g;S.tickets+=otk;lines.push("자리를 비운 동안(최대 "+(offCap()/3600)+"시간, 효율 "+Math.round(offEff()*100)+"%) 골드 <b>"+fmt(g)+"</b>"+(otk?"과 뽑기권 <b>"+otk+"장</b>":"")+"을 모았어요.")}
    if(now-S.lastGift>=6*3600*1000){S.tickets+=3;S.lastGift=now;lines.push("깜짝 선물로 뽑기권 <b>3장</b>이 도착했어요!")}
    if(lines.length)showOv('<div class="panel gold"><p class="banner">돌아오신 걸 환영해요</p><p style="margin:0 0 14px;text-align:center">'+lines.join("<br><br>")+'</p><button class="btn gold wide" data-a="ovclose">받기</button></div>');
    else if(!S.tl)openTitlePick();
  }
  if(S.stage%10===0){S.stage--;S.bossReady=true}
  save();
}
function initTop(){
  E={field:$("b-field"),enemy:$("b-enemy"),psp:$("b-psp"),fx:$("b-fx"),ename:$("b-name"),scene:$("b-scene"),pts:$("b-pts"),player:$("b-player"),pwk:null,fold:false};
  E.field.addEventListener("pointerdown",function(ev){
    if(ev.target&&ev.target.closest&&ev.target.closest("button"))return;
    ev.preventDefault();tap();
  });
  var ps="";for(var i=0;i<KPS;i++)ps+="<span></span>";
  $("b-pips").innerHTML=ps;
  $("ic-gold").innerHTML=spr("🪙",12,1.3);
  $("ic-tix").innerHTML=spr("🎟️",12,1.3);
  $("ic-dia").innerHTML=spr("💎",12,1.3);
  $("ic-q").innerHTML=spr("🏆",14,1.35);
  $("ic-m").innerHTML=spr("✉️",14,1.35);
  $("ic-s").innerHTML=spr("⚙️",14,1.35);
  $("gift").innerHTML=spr("🎁",16,2.4);
  var pi=phIdx(S.stage);
  paintScene(pi);paintPlayer(pi);paintParty();
  $("b-ph").textContent=PH[pi].name;
}
refreshCM();refreshSF();
initTop();
boot();
renderSbar();
renderTab();
uiTop();
dbInit();
setInterval(tick,100);
document.addEventListener("visibilitychange",function(){if(document.hidden){save();cloudSave(false)}});
window.addEventListener("pagehide",save);
})();
</script>
